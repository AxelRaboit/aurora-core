# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.admin_email: '%env(ADMIN_EMAIL)%'
    app.mailer_from: '%env(MAILER_FROM)%'
    # La racine du support local, hors document root. Ne pas l'injecter :
    # tout passe par StorageAdapterInterface, et seuls LocalStorageAdapter
    # et UploadsServeController lisent encore ce paramètre.
    # Voir docs/aurora-core/dev/storage_backends.md.
    app.upload_dir: '%kernel.project_dir%/var/uploads'
    # L'origine du serveur Vite en développement, admise par la CSP.
    app.vite_dev_server: 'http://localhost:5173'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Aurora\:
        resource: '../src/'

    # Auto-tag every MediaUsageProvider so the aggregator service collects them.
    # Auto-tag every registered front so the Registry collects them.
    # Auto-tag every menu location provider so the MenuLocationRegistry collects them.
    # Auto-tag every sequence prefix provider so the conflict listener validates uniqueness at boot.
    # Auto-tag every storage adapter so StorageManager can index them by disk.
    _instanceof:
        Aurora\Core\Module\Contract\ModuleInterface:
            tags: [aurora.module]
        Aurora\Module\Ged\Document\Contract\DocumentUsageProviderInterface:
            tags: [aurora.document_usage_provider]
        Aurora\Core\Frontend\Contract\FrontendInterface:
            tags: [aurora.front]
        Aurora\Module\Editorial\Menu\Contract\MenuLocationProviderInterface:
            tags: [aurora.menu_location_provider]
        Aurora\Core\Sequence\SequencePrefixProviderInterface:
            tags: [aurora.sequence_prefix]
        Aurora\Module\Configuration\Setting\Configuration\ConfigurationTabProviderInterface:
            tags: [aurora.configuration_tab_provider]
        Aurora\Module\Configuration\Setting\Provider\ApplicationParameterProviderInterface:
            tags: [aurora.application_parameter_provider]
        Aurora\Module\Configuration\Setting\Provider\OwnedSettingProviderInterface:
            tags: [aurora.owned_setting_provider]
        Aurora\Core\Bootstrap\BootstrapProviderInterface:
            tags: [aurora.bootstrap_provider]
        Aurora\Core\Search\SearchProviderInterface:
            tags: [aurora.search_provider]
        Aurora\Core\Dashboard\DashboardStatsProviderInterface:
            tags: [aurora.dashboard_stats_provider]
        Aurora\Core\Trash\TrashSourceInterface:
            tags: [aurora.trash_source]
        Aurora\Core\Search\BackendSearchProviderInterface:
            tags: [aurora.backend_search_provider]
        Aurora\Core\Content\BlockRendererInterface:
            tags: [aurora.content_block_renderer]
        Aurora\Core\Reference\EntityReferenceProviderInterface:
            tags: [aurora.entity_reference_provider]
        Aurora\Core\Scheduler\RecurringMessageProviderInterface:
            tags: [aurora.recurring_message_provider]
        Aurora\Core\Storage\Adapter\StorageAdapterInterface:
            tags: [aurora.storage_adapter]
        Aurora\Core\Storage\Access\UploadAccessGuardInterface:
            tags: [aurora.upload_access_guard]
        Aurora\Core\Storage\Orphan\ReferencedKeysProviderInterface:
            tags: [aurora.referenced_keys_provider]

    Aurora\Core\Scheduler\MainSchedule:
        arguments:
            $providers: !tagged_iterator aurora.recurring_message_provider

    # Route loader that auto-discovers controllers of installed aurora-* module
    # packages. Client adds one `type: aurora_modules` routing entry.
    Aurora\Core\Routing\AuroraModuleRouteLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags: [routing.loader]

    Aurora\Module\Ged\Document\Service\DocumentUsageService:
        arguments:
            $providers: !tagged_iterator aurora.document_usage_provider

    Aurora\Core\Sequence\SequencePrefixConflictListener:
        arguments:
            $providers: !tagged_iterator aurora.sequence_prefix

    Aurora\Core\Frontend\Service\Registry:
        arguments:
            $fronts: !tagged_iterator aurora.front

    Aurora\Module\Platform\Auth\Service\ImpersonationTokenService:
        arguments:
            $secret: '%kernel.secret%'

    Aurora\Module\Platform\Auth\Manager\AccessRequestManager:
        arguments:
            $adminEmail: '%app.admin_email%'
            $mailerFrom: '%app.mailer_from%'

    Aurora\Module\Platform\Auth\Manager\InvitationManager:
        arguments:
            $mailerFrom: '%app.mailer_from%'

    Aurora\Module\Platform\Auth\Manager\PasswordResetManager:
        arguments:
            $mailerFrom: '%app.mailer_from%'

    Aurora\Module\Platform\Auth\Manager\EmailVerificationManager:
        arguments:
            $mailerFrom: '%app.mailer_from%'

    Aurora\Core\Twig\VersionExtension:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # La politique de sécurité du contenu. `devMode` ouvre le strict minimum
    # pour le serveur Vite et son socket de rechargement, qui n'existent pas
    # dans un build : la politique de production n'en sait rien.
    Aurora\Core\Http\Csp\ContentSecurityPolicy:
        arguments:
            $devMode: '%kernel.debug%'
            $viteDevServer: '%app.vite_dev_server%'
            # L'origine du hub Mercure, vide quand il n'y en a pas. Derrière le
            # même hôte en production, `'self'` suffirait ; ailleurs non, et une
            # connexion bloquée par la CSP ressemble à un hub en panne.
            $mercurePublicUrl: '%env(MERCURE_PUBLIC_URL)%'

    Aurora\Module\Configuration\Theme\Service\ThemeResolver:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Aurora\Module\Configuration\Theme\Manager\ThemeManager:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Aurora\Module\Configuration\Setting\Command\DumpJsTranslationsCommand:
        arguments:
            $auroraDir: '%kernel.project_dir%'

    Aurora\Core\Module\Service\ModuleRegistry:
        arguments:
            $modules: !tagged_iterator aurora.module

    Aurora\Core\Module\Service\ModuleNavResolver:
        arguments:
            $modules: !tagged_iterator aurora.module

    Aurora\Core\Module\Service\PermissionRegistry:
        arguments:
            $modules: !tagged_iterator aurora.module

    Aurora\Core\Module\Toggle\ModuleToggleRegistry:
        arguments:
            $modules: !tagged_iterator aurora.module

    Aurora\Module\Configuration\Setting\View\ModulesViewBuilder:
        arguments:
            $modules: !tagged_iterator aurora.module

    Aurora\Module\Configuration\Setting\Configuration\SettingDefinitionRegistry:
        arguments:
            $providers: !tagged_iterator aurora.configuration_tab_provider

    # Le manuel du produit, lu dans les fichiers qui l'accompagnent. Le
    # dossier est nommé depuis le bundle, pas depuis le projet client.
    Aurora\Module\Documentation\Service\DocumentationIndex:
        arguments:
            $contentDir: '%aurora.documentation.content_dir%'

    Aurora\Core\Mail\Service\MailService:
        arguments:
            $mailerFrom: '%app.mailer_from%'
            $adminEmail: '%app.admin_email%'

    # --- The Mercure hub ----------------------------------------------------
    #
    # Three services where a line of configuration would do, and the protocol
    # is what forces it. Mercure 1.0 expects an RFC 9068 access token - an
    # issuer, an audience, a subject - and the right to publish is a URL
    # pattern, `https://aurora.invalid/studio/spaces/*/chat`, because a space
    # that does not exist yet cannot be listed. The bundle's own `jwt.publish`
    # node only accepts a flat list of exact topics, which cannot express that.
    #
    # Checked against a 1.0.0 hub: a token in the older protocol is refused
    # outright ("untrusted issuer"), and pinning the audience on the hub side
    # (`resource_identifier`) is what lets PHP publish over the loopback while
    # a browser connects through the public host.
    aurora.mercure.signer:
        class: Symfony\Component\Mercure\Jwt\LcobucciFactory
        # Lazy because an empty secret is a supported state. This class rejects
        # one in its constructor, and with no hub configured there is no secret
        # to give it and nothing will ever ask it to sign. Behind a proxy, that
        # constructor runs the first time a token is actually minted - which
        # only happens once a hub URL is set.
        lazy: true
        arguments:
            $secret: '%env(MERCURE_JWT_SECRET)%'
            $protocolVersion: !php/enum Symfony\Component\Mercure\ProtocolVersion::V1

    # The claims `Authorization` cannot pass itself: it reaches for the hub's
    # factory directly when it mints a subscriber's cookie.
    aurora.mercure.token_factory:
        class: Symfony\Component\Mercure\Jwt\DefaultClaimsTokenFactory
        arguments:
            $decorated: '@aurora.mercure.signer'
            $defaultClaims:
                iss: '%env(MERCURE_ISSUER)%'
                aud: '%env(MERCURE_PUBLIC_URL)%'
                sub: aurora
                client_id: aurora

    aurora.mercure.publisher:
        class: Symfony\Component\Mercure\Jwt\FactoryTokenProvider
        arguments:
            $factory: '@aurora.mercure.token_factory'
            $grants:
                - !service
                    class: Symfony\Component\Mercure\Jwt\Grant
                    arguments:
                        - ['publish']
                        - urlpattern: ['https://aurora.invalid/studio/spaces/*/chat']

# Fixtures live in fixtures/, outside src/, precisely so that nothing scanning
# src/ can reach them: the Doctrine attribute driver and the attribute route
# loader both walk those directories file by file and autoload every class they
# find, and these extend doctrine/doctrine-fixtures-bundle's Fixture, which is a
# dev dependency. Registering them as services stays dev/test-only on top of
# that. AuroraBundle imports this file into every client, so the gating protects
# client prod builds too.
when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        Aurora\Fixtures\:
            resource: '../fixtures/'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        Aurora\Fixtures\:
            resource: '../fixtures/'

        # The only producer of `UploadAccessEnum::Restricted` there is. The
        # shipped guards answer Anonymous or Denied, so without this one the
        # controller's restricted branches are unreachable and the suite
        # cannot say what they do. Tagged explicitly rather than through the
        # `_instanceof` above: that block binds the services of the main
        # section, and a tag this test depends on should not hang on which
        # section a class happens to be declared in.
        Aurora\Tests\Integration\Support\RestrictedAreaUploadAccessGuard:
            tags: [aurora.upload_access_guard]


