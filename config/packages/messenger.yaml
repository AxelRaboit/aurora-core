framework:
    messenger:
        failure_transport: failed

        transports:
            sync: 'sync://'
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: default
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 2
                    max_delay: 60000
            failed: 'doctrine://default?queue_name=failed'
            scheduler_main: 'schedule://main'

        routing:
            # Route this application's OWN messages here. Aurora's are routed
            # by AuroraBundle::prependExtension, so they arrive on consumer
            # projects too - which is the whole point: an unrouted message is
            # not an error, it is a message Symfony handles inline, so a queue
            # declared only here was a queue that quietly did not exist
            # anywhere else.

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
