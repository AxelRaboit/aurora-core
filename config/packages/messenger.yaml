framework:
    messenger:
        failure_transport: failed

        transports:
            sync: 'sync://'
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: default
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 2
                    max_delay: 60000
            failed: 'doctrine://default?queue_name=failed'
            scheduler_main: 'schedule://main'

        routing:
            # Moving a document between storage backends. Small ones are done
            # inline by the request that asked; this is for the rest, where a
            # browser should not be made to wait on a bucket.
            Aurora\Module\Ged\Document\Message\RelocateDocumentMessage: async

            # The mails and the webhook a form submission causes. Queued so an
            # unreachable mail server answers the worker, not the visitor -
            # who would otherwise be told their message failed after it was
            # stored, and would write it again.
            Aurora\Module\Editorial\Form\Message\DeliverFormSubmissionMessage: async

        # Modules used to declare their own routing from their bundle's
        # prependExtension, back when each shipped as a separate package. The
        # split was abandoned, so routing for this monorepo's modules is
        # declared above.

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
