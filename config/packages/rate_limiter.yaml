framework:
    rate_limiter:
        form_submission:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

        # The two write paths a stranger with a link can reach. Both are keyed
        # on the client IP, which is the attacker's to rotate - so they are the
        # outer wall, not the only one: the code carries its own attempt limit
        # and its own ceiling per link.
        contract_signature:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        contract_signature_code:
            policy: sliding_window
            limit: 15
            interval: '1 hour'

        # The password on a deck share link. Keyed on the client IP, like the
        # two above and with the same caveat: an attacker rotates addresses, so
        # this is the outer wall. The inner one is that a wrong password says
        # exactly what a wrong address says, and nothing about which it was.
        deck_share_password:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

        # L'écriture qu'un client tenant un lien d'espace peut atteindre : dire
        # qu'il valide, ou qu'il veut revoir. Calée sur l'IP, donc mur extérieur
        # comme les précédentes - le mur intérieur est que le lien porte ses
        # propres droits, et qu'un lien révoqué ou expiré ne mène nulle part.
        #
        # Plus haut que les limiteurs de signature parce que le geste est
        # différent : on signe un contrat une fois, on parcourt un mois et on
        # valide six publications d'affilée.
        space_guest_write:
            policy: sliding_window
            limit: 40
            interval: '1 hour'

        # Le dépôt de fichier qu'un client tenant un lien peut atteindre.
        # Séparé de `space_guest_write` parce que le geste ne coûte pas la
        # même chose : un avis est une ligne, un fichier traverse le stockage,
        # la vignette et, pour une vidéo, la capture d'une image de couverture.
        #
        # Plus bas en nombre, et c'est voulu : un client envoie les photos
        # d'un mois, pas une bibliothèque. Ce qui filtre *quoi* est
        # `SpaceGuestUploadPolicy`, côté application ; ceci ne filtre que le
        # rythme, par adresse.
        space_guest_upload:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

        # Le lot du dossier Drive, qui n'avait aucune limite alors que c'est la
        # route publique la plus chère : elle télécharge chaque fichier chez
        # Google et construit un zip sur le disque du serveur avant d'envoyer
        # le premier octet. Mesuré à 1,41 Mo par seconde et 0,64 seconde par
        # fichier, un lot de cent cinquante mégaoctets occupe le serveur près
        # de quatre minutes.
        #
        # Très bas, et c'est le sujet : « je prends tout » se fait une fois, et
        # le refaire dix fois de suite n'est pas un geste de client. Séparé des
        # deux autres pour qu'un lot n'épuise pas le droit d'écrire, ni
        # l'inverse.
        space_guest_archive:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

        # The public newsletter and booking endpoints, keyed on the client IP
        # like the ones above. Newsletter and poll writes stay outer-wall only,
        # like the two limiters at the top; the booking one guards a write
        # that also asks a real calendar whether the slot is free.
        newsletter_subscription:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        editorial_booking:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
