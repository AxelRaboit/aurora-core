framework:
    rate_limiter:
        form_submission:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

        # The two write paths a stranger with a link can reach. Both are keyed
        # on the client IP, which is the attacker's to rotate - so they are the
        # outer wall, not the only one: the code carries its own attempt limit
        # and its own ceiling per link.
        contract_signature:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        contract_signature_code:
            policy: sliding_window
            limit: 15
            interval: '1 hour'

        # A note whose share link was opened for writing. Unauthenticated by
        # construction: the address *is* the identity, so a leaked one has
        # nobody to block and revocation only arrives after the damage. Keyed
        # on the client IP, which the attacker rotates - so this is the outer
        # wall, and the inner ones are in the code: a link writes its own note
        # and no other, and the previous state is kept as a version before
        # every write, so nothing a flood does is unrecoverable.
        notes_share_write:
            policy: sliding_window
            limit: 60
            interval: '1 hour'

        # The beat of a guest in a note's live room: one every twenty
        # seconds per open tab, so a hundred and eighty an hour, with room
        # for a few tabs behind one address. Unauthenticated, and every beat
        # without the guest cookie puts a new guest in the room: this is
        # what stops a script from filling it.
        notes_share_live:
            policy: sliding_window
            limit: 600
            interval: '1 hour'

        # The write-back a guest sends for a room of guests, three seconds
        # after the typing pauses. Wider than `notes_share_write` because a
        # session writes every pause, and only reachable through a link
        # whose live co-editing is ticked; the versions are still spaced by
        # the revision interval, so a flood does not flood the history.
        notes_share_coedit_write:
            policy: sliding_window
            limit: 1200
            interval: '1 hour'

        # The password on a publication's reading link. Keyed on the client
        # IP, like the two above and with the same caveat: an attacker rotates
        # addresses, so this is the outer wall. The inner one is that a wrong
        # password says exactly what a wrong address says, and nothing about
        # which it was.
        post_reading_password:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

        # The password on a deliverable's reading link: the same terms.
        deliverable_password:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

        # The write that a client holding a space link can reach: saying they
        # approve, or that they want changes. Keyed on the IP, so an outer wall
        # like the previous ones - the inner wall is that the link carries its
        # own rights, and that a revoked or expired link leads nowhere.
        #
        # Higher than the signing limiters because the gesture is different:
        # you sign a contract once, but you go through a month and approve six
        # posts in a row.
        # The short address of a client space (/c/fournier-k7m2q9), keyed on
        # the client IP. Every visit counts, found or not: the random end is
        # what keeps a name from being guessed, and this is what keeps anyone
        # from walking through the names. A client opens their space a few
        # times a day.
        space_alias:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'

        space_guest_write:
            policy: sliding_window
            limit: 40
            interval: '1 hour'

        # The file upload that a client holding a link can reach.
        # Separate from `space_guest_write` because the gesture does not cost
        # the same: a review is one row, a file goes through storage, the
        # thumbnail and, for a video, the capture of a cover frame.
        #
        # Lower in count, on purpose: a client sends a month's photos, not a
        # library. What filters *what* is `SpaceGuestUploadPolicy`, on the
        # application side; this only filters the pace, per address.
        space_guest_upload:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

        # The Drive folder batch, which had no limit even though it is the most
        # expensive public route: it downloads every file from Google and
        # builds a zip on the server disk before sending the first byte.
        # Measured at 1.41 MB per second and 0.64 seconds per file, a batch of
        # one hundred and fifty megabytes keeps the server busy for nearly
        # four minutes.
        #
        # Very low, and that is the point: "I take everything" happens once,
        # and doing it ten times in a row is not something a client does.
        # Separate from the other two so that a batch does not use up the
        # right to write, nor the other way round.
        space_guest_archive:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

        # The password that opens the Drive tab of a space. It had no limit: a
        # teammate who sees the space could try it endlessly. Counted per
        # person and per space rather than per IP, because the route is behind
        # a session: it is the person who is trying.
        space_drive_unlock:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'

        # The public newsletter, booking and poll endpoints, keyed on the client
        # IP like the ones above. The booking one also guards a write that asks
        # a real calendar whether the slot is free. The poll one is looser: a
        # vote is already one per reader, and a household behind one address
        # may vote on several polls of a page.
        editorial_poll_vote:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        newsletter_subscription:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        editorial_booking:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
