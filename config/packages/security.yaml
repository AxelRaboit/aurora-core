security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]
        ROLE_DEV: [ROLE_ADMIN]

    providers:
        app_user_provider:
            entity:
                class: Aurora\Module\Platform\User\Entity\User
                property: email
        admin_user_provider:
            id: Aurora\Module\Platform\Auth\Security\Suite\UserProvider
        front_user_provider:
            id: Aurora\Module\Platform\Auth\Security\Frontend\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # ── Admin / CMS suite ───────────────────────────────────────────────
        admin:
            context: admin
            # `workspace` is staff-only like the other two, and it is not
            # under `/suite` on purpose: a client space is opened in its own
            # shell, without the admin chrome, and the address says so. What it
            # must not lose by leaving that prefix is the identity - outside
            # this pattern no suite session is restored, and a member of the
            # team would arrive on their own client's board as an anonymous
            # visitor. Adding the prefix here is what keeps the two apart:
            # what is drawn, and who is recognised.
            pattern: ^/(suite|dev|workspace)
            provider: admin_user_provider
            user_checker: Aurora\Module\Platform\Auth\Security\Suite\UserChecker
            form_login:
                login_path: suite_platform_login
                check_path: suite_platform_login
                enable_csrf: true
                default_target_path: suite_dashboard
                username_parameter: email
                password_parameter: password
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: suite_platform_logout
                target: suite_platform_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
            switch_user: { role: ROLE_ADMIN }

        # ── Front / Public users ──────────────────────────────────────────────
        main:
            context: front
            lazy: true
            provider: front_user_provider
            user_checker: Aurora\Module\Platform\Auth\Security\Frontend\UserChecker
            custom_authenticators:
                - Aurora\Module\Platform\Auth\Security\Frontend\LoginAuthenticator
            entry_point: Aurora\Module\Platform\Auth\Security\Frontend\AuthEntryPoint
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000

    access_control:
        - { path: ^/suite/platform/login, roles: PUBLIC_ACCESS }
        - { path: ^/suite/platform/logout, roles: PUBLIC_ACCESS }
        - { path: ^/suite/platform/register, roles: PUBLIC_ACCESS }
        - { path: ^/suite/platform/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/suite/platform/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/suite/platform/access-request, roles: PUBLIC_ACCESS }
        - { path: ^/suite/platform/invitation, roles: PUBLIC_ACCESS }
        - { path: ^/suite/platform/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/suite/platform/resend-verification, roles: PUBLIC_ACCESS }
        - { path: ^/front-login-check, roles: PUBLIC_ACCESS }
        - { path: '^/[a-z]{2}/impersonate/', roles: PUBLIC_ACCESS }
        - { path: '^/[a-z]{2}/forgot-password', roles: PUBLIC_ACCESS }
        - { path: '^/[a-z]{2}/reset-password', roles: PUBLIC_ACCESS }
        # Setting one's password when arriving from an invitation: the person
        # is not logged in yet, by definition. The `^/` catch-all below would
        # cover it, but every authentication route is listed explicitly here -
        # leaving one out would break it the day that catch-all is tightened.
        - { path: '^/[a-z]{2}/invitation', roles: PUBLIC_ACCESS }
        - { path: '^/[a-z]{2}/register', roles: PUBLIC_ACCESS }
        - { path: '^/[a-z]{2}/resend-verification', roles: PUBLIC_ACCESS }
        - { path: '^/[a-z]{2}/verify-email', roles: PUBLIC_ACCESS }
        - { path: ^/suite, roles: ROLE_USER }
        - { path: ^/dev, roles: ROLE_DEV }
        # The client spaces' second wall. The controller already carries its
        # `#[IsGranted]`, so an anonymous visitor is refused without this line -
        # but the day an action arrives under this prefix without the
        # attribute, the `^/` catch-all below would silently make it public.
        # `/suite` has always had this belt; `/workspace` left `/suite` without
        # it, and that is all this line repairs.
        - { path: ^/workspace, roles: ROLE_USER }
        - { path: '^/[a-z]{2}/account', roles: ROLE_USER }
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
