suite:
    search:
        sections:
            notes: Notes
    parameters:
        notes_markdown_image_max_edge:
            label: Notes Markdown - Max image size (px)
            description: "Notes Markdown: longest edge in pixels. Images larger than this are downscaled in the browser before upload. Recommended: 2048."
        notes_markdown_image_quality_pct:
            label: Notes Markdown - WebP encoding quality (%)
            description: "Notes Markdown: WebP quality applied during the resize, 0 to 100. Recommended: 85 (good size/quality trade-off)."
        notes_markdown_revisions_limit:
            label: Markdown notes - Versions kept per note
            description: "Markdown notes: how many past versions each note keeps in its history, the oldest going first. 0 keeps them all. Recommended: 50."
        notes_markdown_revision_interval_minutes:
            label: Markdown notes - Time between two versions (minutes)
            description: "Markdown notes: the editor saves every few seconds; a new version is kept only when the previous one is at least this many minutes old. Restoring a version always keeps the current state. Recommended: 10."
    permissions:
        names:
            notes:
                markdown:
                    use: Use Markdown notes
                spaces:
                    create: 'Create shared note spaces'
                    publish: 'Publish note spaces on the web'
    modules:
        notes_suite: Notes
        # The module string an audit row carries, which is not the toggle key.
        notes_markdown: Markdown notes
        notes_suite_description: Enables markdown note-taking, with links between notes and a graph.
        notes_collaboration: Notes with other people
        notes_collaboration_description: Hand a note to somebody on the team, or open a share link for writing.
    nav:
        sections:
            notes: Notes
        notes_markdown: Markdown notes
        notes_markdown_description: Obsidian-style Markdown note-taking (wiki-links, graph)
    audit:
        actions:
            notes_markdown:
                space:
                    published: "Note space published"
                    unpublished: "Note space unpublished"
                    created: "Note space created"
                    updated: "Note space updated"
                    deleted: "Note space removed"
                note:
                    imported_from_craft: Note imported from Craft
                    text_updated: Note text rewritten through a share link
                    shared_with_person: Note handed to a person
                    unshared_with_person: Note taken back from a person
                    trashed: Note moved to trash
                    restored: Note restored
                    created: Note created
                    updated: Note updated
                    deleted: Note permanently deleted
                folder:
                    created: Folder created
                    updated: Folder updated
                    trashed: Folder moved to the trash
                    restored: Folder restored
                    deleted: Folder permanently deleted
                share_link:
                    created: Share link created
                    revoked: Share link revoked
                tag:
                    renamed: Tag renamed
                    merged: Tags merged
                    removed: Tag removed
notes:
    craft:
        settings:
            what_title: What this connection does
            what_body: "It imports a Craft document into a note space. It is a copy: the document stays in Craft, and the note does not change on its own afterwards."
            how_title: How to open it
            how_step_connection: "In Craft, sidebar, Connections tab: « Add your first API connection », then « API for selected documents ». A whole-space connection would give access to everything in it, including what has no business here."
            how_step_select: "Pick the documents the notes will be able to import. Craft exposes only those, and the list can be changed there at any time."
            how_step_mode: "Set the connection to read-only and to « API key » mode. In public mode, the address alone would be enough to write and delete on your side."
            how_step_paste: "Copy the address and the key, and paste them below. Craft shows the key only once."
            scope_title: "What this key can do"
            scope_body: "Read the documents you ticked, and nothing else. That is why read-only matters: a write connection would let this application modify and delete your Craft documents, when all it does is import."
            then_title: "Then, note space by note space"
            then_body: "« Import from Craft » appears in the menu of every note space, a customer space's included, which its Notes tab opens too. The import is a plain copy: the document stays in Craft, and the note will not follow its changes."
            trouble_title: "When the list is empty or silent"
            trouble_body: "An empty list means the connection exposes no document: go back to Craft and add some. No answer at all means the address or the key no longer fit, often because the connection was recreated in Craft, which then mints a new key."
            how_link: Craft's own instructions
            endpoint_label: Connection address
            endpoint_hint: "The one Craft shows when the connection is created. Over https, otherwise the key travels in the clear."
            token_label: API key
            token_hint: "The one Craft shows once the connection is in API key mode."
            token_stored: A key is saved. Leave the field empty to keep it.
            enabled_label: Enable importing from Craft
            enabled_hint: The action appears in the menu of every note space.
            enabled_blocked: Enter an address and a key before enabling.
        import:
            action: Import from Craft
            title: Import a Craft note
            intro: "The document is copied into this note space. It stays in Craft, and the note will not follow its changes."
            empty: No document in this connection.
            unreachable: "Craft did not answer."
            unreachable_hint: "Check the address and the key in the settings, Craft tab."
            empty_hint: "Go back to Craft to add documents to the connection."
            disabled: "Importing from Craft is not enabled."
            disabled_hint: "It is switched on in the settings, Craft tab."
            imported: Note imported.
