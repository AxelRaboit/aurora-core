            title: "Cómo se organizan las notas"
            step_1: "Cada nota pertenece a un espacio de notas: el suyo, siempre privado, o un espacio de notas compartido."
            step_2: "Un espacio de notas compartido se abre solo a usted, a algunas personas o a toda la suite, cada una con lectura, escritura o gestión."
            step_3: "Enlace las notas con [[Título]]: el grafo muestra esos enlaces entre todas las notas que puede leer."
            step_4: "Las etiquetas filtran la biblioteca, y «Gestionar etiquetas» las renombra o fusiona en todas sus notas."
            step_5: "Una nota también se comparte con un enlace de solo lectura; ni siquiera un administrador lee sus notas privadas."
            step_6: "El menú Acciones de una nota la duplica, la convierte en plantilla, vuelve a una versión anterior o la imprime en PDF."
            step_7: "Escriba « / » al principio de una línea para insertar un título, una lista o una tabla: « /tabla 3x4 » crea 3 columnas y 4 filas, y Tab pasa de una celda a otra."
            step_8: 'El icono de descarga exporta en zip lo que está viendo: todo, un espacio o una carpeta. Una carpeta por espacio, un archivo Markdown por nota, las etiquetas al principio: Obsidian lo abre tal cual.'
