notes:
    craft:
        settings:
            what_title: 'Lo que hace esta conexión'
            what_body: 'Permite importar un documento de Craft a un espacio de notas. Es una copia: el documento permanece en Craft, y la nota ya no cambia por sí sola después.'
            how_title: 'Cómo abrirla'
            how_step_connection: 'En Craft, barra lateral, pestaña Conexiones: «Añada su primera conexión API», y luego «API para los documentos seleccionados». Una conexión sobre el espacio entero daría acceso a todo lo que contiene, incluido lo que no tiene nada que hacer aquí.'
            how_step_select: 'Elija los documentos que las notas podrán importar. Craft solo expondrá esos, y la lista se puede modificar en Craft en cualquier momento.'
            how_step_mode: 'Configure la conexión en solo lectura y en modo «Clave API». En modo público, bastaría la dirección para escribir y eliminar en su cuenta.'
            how_step_paste: 'Copie la dirección y la clave, y péguelas a continuación. Craft solo muestra la clave una vez.'
            scope_title: 'Lo que puede hacer esta clave'
            scope_body: 'Leer los documentos que ha marcado, y nada más. Por eso importa el modo «solo lectura»: una conexión con escritura permitiría editar y eliminar sus documentos de Craft desde esta aplicación, cuando esta solo importa.'
            then_title: "Después, espacio de notas por espacio de notas"
            then_body: '«Importar desde Craft» aparece en el menú de cada espacio de notas, incluido el de un espacio de cliente, que su pestaña Notas también abre. La importación es una copia pura: el documento permanece en Craft, y la nota no seguirá sus cambios.'
            trouble_title: 'Cuando la lista está vacía o no responde'
            trouble_body: 'Una lista vacía significa que la conexión no expone ningún documento: vuelva a Craft para añadirlos. Una falta de respuesta significa que la dirección o la clave ya no son válidas, a menudo porque la conexión se ha vuelto a crear en Craft, que entonces genera una nueva clave.'
            how_link: 'Los pasos a seguir en Craft'
            endpoint_label: 'Dirección de la conexión'
            endpoint_hint: 'La que Craft muestra al crear la conexión. En https, de lo contrario la clave viajaría sin cifrar.'
            token_label: 'Clave API'
            token_hint: 'La que Craft muestra una vez que la conexión pasa al modo «Clave API».'
            token_stored: 'Hay una clave guardada. Deje el campo vacío para conservarla.'
            enabled_label: 'Activar la importación desde Craft'
            enabled_hint: 'La acción aparece en el menú de cada espacio de notas.'
            enabled_blocked: 'Indique una dirección y una clave para poder activarla.'
        import:
            action: 'Importar desde Craft'
            title: 'Importar una nota de Craft'
            intro: 'El documento se copia en este espacio de notas. Permanece en Craft, y la nota no seguirá sus cambios.'
            empty: 'Ningún documento en esta conexión.'
            unreachable: 'Craft no ha respondido.'
            unreachable_hint: 'Compruebe la dirección y la clave en los ajustes, pestaña Craft.'
            empty_hint: 'Vuelva a Craft para añadir documentos a la conexión.'
            disabled: 'La importación desde Craft no está activada.'
            disabled_hint: 'Se activa en los ajustes, pestaña Craft.'
            imported: 'Nota importada.'
            refresh: 'Actualizar desde Craft'
            refresh_confirm: '¿Restablecer «{title}» a la versión actual del documento de Craft?'
            refresh_warning: 'El texto de la nota se sustituye; la versión anterior queda en su historial. Su título, su carpeta, sus etiquetas y su portada se conservan.'
            refresh_submit: Actualizar
            refreshed: 'Nota actualizada.'
            submit: Importar
