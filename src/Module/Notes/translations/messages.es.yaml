        notes_markdown_image_max_edge:
            label: 'Notas Markdown - Tamaño máx. de las imágenes (px)'
            description: 'Notas Markdown: lado más largo, en píxeles. Las imágenes que superan este límite se redimensionan en el navegador antes del envío. Recomendado: 2048.'
        notes_markdown_image_quality_pct:
            label: 'Notas Markdown - Calidad de codificación WebP (%)'
            description: 'Notas Markdown: calidad WebP aplicada al redimensionar, entre 0 y 100. Recomendado: 85 (buen equilibrio tamaño/calidad).'
        notes_markdown_revisions_limit:
            label: 'Notas Markdown - Versiones guardadas por nota'
            description: 'Notas Markdown: cuántas versiones anteriores guarda cada nota en su historial; las más antiguas se van primero. 0 las guarda todas. Recomendado: 50.'
        notes_markdown_revision_interval_minutes:
            label: 'Notas Markdown - Intervalo entre dos versiones (minutos)'
            description: 'Notas Markdown: el editor guarda cada pocos segundos; solo se guarda una nueva versión si la anterior tiene al menos estos minutos. Restaurar una versión siempre guarda el estado actual. Recomendado: 10.'
