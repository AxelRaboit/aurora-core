notes:
    craft:
        # Craft keeps lasting knowledge; a note keeps what is drawn from it for
        # a piece of work. The import moves from one to the other as a plain
        # copy: nothing comes back to change the note afterwards, except an
        # update someone asks for.
        settings:
            what_title: Ce que fait cette connexion
            what_body: "Elle permet d'importer un document Craft dans un espace de notes. C'est une copie : le document reste chez Craft, et la note ne change plus toute seule ensuite."
            how_title: Comment l'ouvrir
            how_step_connection: "Dans Craft, barre latérale, onglet Connexions : « Ajoutez votre première connexion API », puis « API pour les documents sélectionnés ». Une connexion sur l'espace entier donnerait accès à tout ce qu'il contient, y compris ce qui n'a rien à faire ici."
            how_step_select: "Choisissez les documents que les notes pourront importer. Craft n'exposera que ceux-là, et la liste se modifie chez lui à tout moment."
            how_step_mode: "Réglez la connexion en lecture seule et en mode « Clé API ». En mode public, l'adresse seule suffirait à écrire et à supprimer chez vous."
            how_step_paste: "Copiez l'adresse et la clé, et collez-les ci-dessous. Craft n'affiche la clé qu'une fois."
            scope_title: "Ce que cette clé peut faire"
            scope_body: "Lire les documents que vous avez cochés, et rien d'autre. C'est pour cela que le mode « lecture seule » compte : une connexion en écriture laisserait modifier et supprimer vos documents Craft depuis cette application, alors qu'elle ne fait qu'importer."
            then_title: "Ensuite, espace de notes par espace de notes"
            then_body: "« Importer depuis Craft » apparaît dans le menu de chaque espace de notes, y compris celui d'un espace client, que son onglet Notes ouvre aussi. L'import est une copie franche : le document reste chez Craft, et la note ne suivra pas ses modifications."
            trouble_title: "Quand la liste est vide ou muette"
            trouble_body: "Une liste vide veut dire que la connexion n'expose aucun document : retournez dans Craft en ajouter. Une absence de réponse veut dire que l'adresse ou la clé ne conviennent plus, souvent parce que la connexion a été recréée chez Craft, qui frappe alors une nouvelle clé."
            how_link: La marche à suivre chez Craft
            endpoint_label: Adresse de la connexion
            endpoint_hint: "Celle que Craft affiche à la création de la connexion. En https, sans quoi la clé voyagerait en clair."
            token_label: Clé API
            token_hint: "Celle que Craft affiche une fois la connexion passée en mode « Clé API »."
            token_stored: Une clé est enregistrée. Laissez le champ vide pour la garder.
            enabled_label: Activer l'import depuis Craft
            enabled_hint: Le geste apparaît dans le menu de chaque espace de notes.
            enabled_blocked: Renseignez une adresse et une clé pour pouvoir activer.
        import:
            action: Importer depuis Craft
            title: Importer une note Craft
            intro: "Le document est copié dans cet espace de notes. Il reste chez Craft, et la note ne suivra pas ses modifications."
            empty: Aucun document dans cette connexion.
            unreachable: "Craft n'a pas répondu."
            unreachable_hint: "Vérifiez l'adresse et la clé dans les réglages, onglet Craft."
            empty_hint: "Retournez dans Craft pour ajouter des documents à la connexion."
            disabled: "L'import depuis Craft n'est pas activé."
            disabled_hint: "Il s'ouvre dans les réglages, onglet Craft."
            imported: Note importée.
            refresh: Mettre à jour depuis Craft
            refresh_confirm: "Remettre « {title} » sur la version actuelle du document Craft ?"
            refresh_warning: "Le texte de la note est remplacé ; la version d'avant reste dans son historique. Son titre, son dossier, ses étiquettes et son bandeau sont conservés."
            refresh_submit: Mettre à jour
            refreshed: Note mise à jour.
            submit: Importer
        errors:
            endpoint_https: "L'adresse de la connexion doit commencer par https://."
            connection_required: Renseignez une adresse et une clé avant d'activer.
            document_required: Choisissez un document à importer.
            unreachable: "Craft n'a rien renvoyé pour ce document."
            not_imported: Cette note ne vient pas de Craft.
    markdown:
        guide:
            title: "Comment s'organisent les notes"
            step_1: "Chaque note appartient à un espace de notes : le vôtre, toujours privé, ou un espace de notes partagé."
            step_2: "Un espace de notes partagé s'ouvre à vous seul, à certaines personnes ou à toute la suite, chacun en lecture, écriture ou gestion."
            step_3: "Reliez les notes avec [[Titre]] : le graphe montre ces liens entre toutes les notes que vous pouvez lire."
            step_4: "Les étiquettes filtrent la bibliothèque, et « Gérer les tags » les renomme ou les fusionne sur toutes vos notes."
            step_5: "Une note se partage aussi par un lien en lecture seule ; même un administrateur ne lit pas vos notes privées."
            step_6: "Le menu Actions d'une note la duplique, en fait un modèle, revient à une version passée ou l'imprime en PDF."
            step_7: "Tapez « / » en début de ligne pour insérer un titre, une liste ou un tableau : « /tableau 3x4 » crée 3 colonnes et 4 lignes, et Tab passe d'une case à l'autre."
            step_8: "L'icône de téléchargement exporte en zip ce que vous regardez : tout, un espace ou un dossier. Un dossier par espace, un fichier Markdown par note, les étiquettes en tête : Obsidian l'ouvre tel quel."
