            label: Notes Markdown - Taille max des images (px)
            description: "Notes Markdown : côté le plus long, en pixels. Les images dépassant cette limite sont redimensionnées côté navigateur avant l'envoi. Recommandé : 2048."
        notes_markdown_image_quality_pct:
            label: Notes Markdown - Qualité d'encodage WebP (%)
            description: "Notes Markdown : qualité WebP appliquée au redimensionnement, entre 0 et 100. Recommandé : 85 (bon compromis taille/qualité)."
        notes_markdown_revisions_limit:
            label: Notes Markdown - Versions gardées par note
            description: "Notes Markdown : combien de versions passées chaque note garde dans son historique, les plus anciennes partant d'abord. 0 les garde toutes. Recommandé : 50."
        notes_markdown_revision_interval_minutes:
            label: Notes Markdown - Écart entre deux versions (minutes)
            description: "Notes Markdown : l'éditeur enregistre toutes les quelques secondes ; une nouvelle version n'est gardée que si la précédente a au moins ce nombre de minutes. Restaurer une version garde toujours l'état courant. Recommandé : 10."
