    core_reset_password_prefix:
      label: Password reset request prefix
      description: Auto-generated reference prefix (e.g. XXX). Leave empty to disable.
    core_media_folder_prefix:
      label: Media folder reference prefix
      description: Auto-generated reference prefix (e.g. XXX). Leave empty to disable.
    core_menu_item_prefix:
      label: Menu item reference prefix
      description: Auto-generated reference prefix (e.g. XXX). Leave empty to disable.
    studio_contract_prefix:
      label: Contract reference prefix
      description: 'Prefix of contract references. CTR by default, which gives CTR-2026-0001.'
    studio_provider_name:
      label: Provider's trading name
      description: 'The name you contract under, as it prints at the top of the contract.'
    studio_provider_representative:
      label: Name
      description: 'The individual who signs. Printed alongside the trading name.'
    studio_provider_address:
      label: Business address
      description: 'The full address on one line: it appears in the contract''s identity block.'
    studio_provider_siret:
      label: SIRET
      description: 'The SIRET of the establishment that contracts.'
    studio_provider_ape_code:
      label: APE code
      description: 'Code and wording, for instance 7021Z - public relations and communication consultancy.'
    studio_provider_vat_mention:
      label: VAT wording
      description: 'The exact sentence to print, for instance "not liable - VAT not applicable, art. 293 B of the CGI".'
    studio_provider_email:
      label: Email
      description: 'The address a customer writes to under the contract.'
    studio_provider_phone:
      label: Phone
      description: 'The number printed in the identity block.'
    studio_provider_bank_holder:
      label: Account holder
      description: 'The holder''s name, as it appears on the statement.'
    studio_provider_bank_iban:
      label: IBAN
      description: 'The IBAN printed in the contract''s financial terms.'
    studio_provider_bank_bic:
      label: BIC
      description: 'The bank''s BIC.'
    studio_provider_bank_name:
      label: Bank
      description: 'The bank''s name, and its address if you print it.'
    studio_contract_retention_years:
      label: Retention (years)
      description: 'How many years a sealed contract is kept before it can be deleted. Five years is the legal floor, ten are advised for a service provider; under five, the value is raised back to five.'
    studio_contract_reminder_enabled:
      label: Chase automatically
      description: 'Emails a reminder for contracts sent and not signed. Every reminder mints a new signing address and invalidates the previous one, exactly like a manual resend.'
    studio_contract_reminder_days:
      label: Days between reminders
      description: 'Days without an answer before a reminder goes out. Counted from the last send, not from the seal.'
    studio_contract_reminder_max:
      label: Maximum number of reminders
      description: 'Past that, the contract is left alone. Silence is an answer too.'
    nav_section_aliases:
      label: Navigation section aliases
      description: JSON map of section aliases (managed via the UI).
    nav_item_aliases:
      label: Navigation item aliases
      description: JSON map of menu item aliases (managed via the UI).
    color_picker_presets:
      label: Color picker palette
      description: JSON list of hex colors offered as quick-pick swatches in every admin color selector.
