                incomplete: "Something is missing. Fill in the account address, the bucket and both keys."
                signature: "The secret access key does not match the access key id. Both are shown once, at token creation: making a new token is quicker than hunting."
                denied: "Cloudflare answers but refuses. Check the token carries \"Object Read & Write\" rather than read only, and that its scope includes this bucket."
                no_bucket: "That bucket does not exist at this address. Note the account address must not end with the bucket name."
                unreachable: "The address did not answer. Check it, and check this server can reach it."
            errors:
