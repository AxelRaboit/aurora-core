        storage:
            guide:
                title: "In which order to proceed"
                step_1: "With nothing connected, your files stay on the server's disk: this screen is only for moving to Cloudflare R2."
                step_2: "Fill in the account address, the bucket and both keys, then run “Test the connection”, which saves before checking."
                step_3: "Once the test passes, choose where new files are written and save: the files already in place do not move."
                step_4: "To move existing documents, use the move action of the media library, one document at a time or all at once."
                step_5: "“Disconnect storage” erases the keys, and is refused while a document still sits on the remote storage."
            intro: "By default the files you upload are written to the server's disk. You can hand them to Cloudflare R2 object storage instead, on your own account."
            when_useful: "Mostly worth it if you store a lot, or large files. Below a few gigabytes the server's disk does the job and needs no configuring."
            how_title: How to get the credentials
            how_step_bucket: "In the Cloudflare dashboard, open R2 and create a bucket, or pick an existing one."
            how_step_token: "Create an API token with the \"Object Read & Write\" permission, scoped to that one bucket. Read only is not enough: the application has to write."
            how_step_copy: "Copy the access key id and the secret access key. Cloudflare shows them once."
            how_link: Open the Cloudflare R2 documentation
            endpoint_label: Account address
            endpoint_hint: "The account URL, with no bucket name at the end. The console shows one with the bucket appended: pasting that would put it in twice."
            bucket_label: Bucket
            bucket_hint: The bucket name on its own.
            access_key_label: Access key id
            secret_key_label: Secret access key
            key_stored: A value is stored. Leave empty to keep it.
            key_hint: Copied from Cloudflare when the token was created.
            public_url_label: Public hostname
            public_url_hint: "Optional. The hostname you mapped onto the bucket, if you mapped one. Without it, files stay served by the application."
            delivery_title: How files are served
            delivery_hint: "A document's address never changes, whichever you pick. What changes is only how the application answers it."
            delivery_proxy: Through the application
            delivery_proxy_hint: "The bytes cross the server. Simplest, and your access rules keep applying."
            delivery_presigned: Through a temporary signed link
            delivery_presigned_hint: "The bytes go straight from storage to the visitor, and the files stay private."
            delivery_public_url: Through the public hostname
            delivery_public_url_hint: "Fastest, and cached. Files become readable by anyone holding the address."
            test_button: Test the connection
            banner_none: "No remote storage configured. Files are written to the server's disk."
            banner_untested: "Configuration filled in but never tested. Run the test before relying on it."
            banner_connected: "Connected to Cloudflare R2, bucket “{bucket}”, verified on {date}. New files go to: {target}."
            banner_from_environment: "This configuration comes from the server's environment, not from this screen."
            disconnect_button: "Disconnect storage"
            disconnect_confirm: "Both keys will be erased, along with the address and the bucket. New files will go back to the server's disk."
            disconnect_warning: "Cloudflare only shows a key when it is created: going back means creating a new token, not finding this one again."
            disconnected: "Remote storage disconnected."
            test_intro: "The test writes a witness file, reads it back, checks it is there, then deletes it. It is the only way to know a token may really write."
            test_passed: "Connection verified on {date}."
            test_never: "Never tested. The test is required before the storage can be switched."
            active_disk_label: Write new files to
            disk_local: The server's disk
            usage_title: What is stored
            usage_active: receiving
            usage_files: "No file | 1 file | {count} files"
            usage_hint: "The weight of the library's documents, trash excluded. Leftovers from a failed import and resized copies a purge has not swept are not counted."
            disk_r2: Cloudflare R2
            switch_blocked: Test the connection before switching.
            switch_hint: "Only affects files from now on. The ones already stored do not move."
            probe:
                write: write
                read_back: read back
                exists: presence
                metadata: size and date
                listing: visible in the listing
                cleanup: cleanup
