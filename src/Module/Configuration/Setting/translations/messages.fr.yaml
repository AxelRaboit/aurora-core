        storage:
            guide:
                title: "Dans quel ordre s'y prendre"
                step_1: "Sans rien brancher, vos fichiers restent sur le disque du serveur : cet écran ne sert que pour passer à Cloudflare R2."
                step_2: "Renseignez l'adresse du compte, le compartiment et les deux clés, puis lancez « Tester la connexion », qui enregistre avant de vérifier."
                step_3: "Une fois le test réussi, choisissez où écrire les nouveaux fichiers et enregistrez : ceux déjà en place ne bougent pas."
                step_4: "Pour déplacer des documents existants, utilisez le déplacement de la médiathèque, document par document ou tous à la fois."
                step_5: "« Débrancher le stockage » efface les clés, et reste refusé tant qu'un document se trouve encore sur le stockage distant."
            intro: "Par défaut, les fichiers que vous déposez sont écrits sur le disque du serveur. Vous pouvez à la place les confier à un stockage objet Cloudflare R2, sur votre propre compte."
            when_useful: "Utile surtout si vous stockez beaucoup, ou de gros fichiers. En dessous de quelques giga-octets, le disque du serveur fait très bien l'affaire et demande moins de réglages."
            how_title: Comment obtenir les identifiants
            how_step_bucket: "Dans le tableau de bord Cloudflare, ouvrez R2 et créez un compartiment, ou choisissez-en un existant."
            how_step_token: "Créez un jeton d'API avec la permission « Object Read & Write », limitée à ce seul compartiment. La lecture seule ne suffit pas : l'application doit pouvoir écrire."
            how_step_copy: "Copiez l'identifiant de clé et la clé secrète. Cloudflare ne les affiche qu'une fois."
            how_link: Ouvrir la documentation Cloudflare R2
            endpoint_label: Adresse du compte
            endpoint_hint: "L'URL du compte, sans le nom du compartiment à la fin. La console en affiche une avec le compartiment ajouté : la coller telle quelle le ferait apparaître deux fois."
