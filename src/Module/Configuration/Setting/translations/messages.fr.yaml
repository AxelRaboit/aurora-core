    studio_contract_retention_years:
      label: Durée de conservation (années)
      description: 'Combien d''années un contrat scellé est conservé avant de pouvoir être supprimé. Cinq ans est le minimum légal, dix sont conseillés pour une prestation de services ; sous cinq, la valeur est ramenée à cinq.'
    studio_contract_reminder_enabled:
      label: Relancer automatiquement
