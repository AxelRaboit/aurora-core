            label: 'Tamaño máx. de subida (MB)'
            description: 'Límite, en megabytes, de cualquier archivo subido - biblioteca y espacios de cliente. Los invitados de un espacio siguen limitados además a 25 MB.'
            placeholder: 100
        timezone:
            label: 'Zona horaria'
            description: 'La hora del sitio: la de una publicación programada, la de las fechas en los emails y los PDF, la de los envíos de la mañana (recordatorios, revisiones atrasadas), y la zona propuesta para un nuevo calendario o espacio. Las fechas ya guardadas no cambian.'
        date_format:
            label: 'Estilo de las fechas'
            description: 'Cómo se escriben las fechas de los emails, los PDF y las páginas de contrato, en el idioma de cada uno. La suite mantiene sus formatos compactos.'
        comments_enabled:
            label: 'Comentarios activados'
            description: 'Si se activa, los visitantes pueden dejar comentarios en los artículos del sitio público.'
        comment_moderation_enabled:
            label: 'Moderación de comentarios'
            description: 'Si se activa, los comentarios quedan pendientes de moderación antes de publicarse. Si se desactiva, se aprueban automáticamente.'
