            description: 'Permitir los registros a través de /suite/platform/register. Desactívelo después de crear la primera cuenta de administrador.'
        admin_access_request_enabled:
            label: 'Solicitudes de acceso de administración abiertas'
            description: 'Permitir las solicitudes de acceso a través de /suite/platform/access-request (formulario de solicitud de acceso a la administración)'
        front_login_enabled:
            label: 'Inicio de sesión en el frontend activado'
            description: 'Si se desactiva, el sitio público deja de tener cuentas: el inicio de sesión, el registro, el espacio de cliente y la contraseña olvidada devuelven un 404, y los enlaces correspondientes desaparecen de los menús. Desactívelo para una aplicación puramente de escaparate.'
        front_registration_enabled:
            label: 'Registros en el frontend abiertos'
            description: 'Si se activa, los visitantes pueden crear una cuenta desde el sitio público. No tiene efecto si el inicio de sesión en el frontend está desactivado.'
