            label: 'Modo de un solo idioma'
            description: 'Si se activa, la aplicación solo muestra y guarda un idioma (el definido en «Idioma por defecto»). Las pestañas multilingües se ocultan y las URL con otro código de idioma se redirigen (301). Reversible: los contenidos introducidos en los demás idiomas se conservan en la base.'
        posts_per_page:
            label: 'Artículos por página'
            description: 'Número de artículos mostrados por página en las listas públicas'
            placeholder: 10
