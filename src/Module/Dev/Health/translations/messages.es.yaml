suite:
    health:
        title: Estado del sistema
        checked_at: 'Medido a las {time}'
        refresh: Volver a medir
        loading: Midiendo…
        load_failed: "La medición no se completó. Inténtelo de nuevo."
        summary:
            ok: Todo funciona.
            warning: Todo funciona, con un punto que revisar.
            danger: Algo no funciona.
            unknown: Aún no hay perspectiva suficiente para juzgarlo todo.
        statuses:
            ok: OK
            warning: Por revisar
            danger: Caído
            unknown: Aún no visto
            'off': No configurado
        sections:
            background: Trabajo en segundo plano
            foundations: Lo que sostiene la aplicación
            environment: Entorno
        guide:
            title: Cómo funciona
            step_1: "Cada línea se mide al abrir la página, y luego a petición con « Volver a medir »."
            step_2: "El worker escribe un latido cada 30 segundos: en silencio más de 2 minutos, se señala como caído."
            step_3: "Cada tarea programada se juzga según su propio ritmo: una tarea de cada minuto en silencio desde hace 10 minutos va con retraso, una tarea nocturna no. Tras un despliegue, una tarea está « aún no vista » hasta su próxima ejecución."
            step_4: "Un mensaje fallido se relanza o se elimina desde la lista. Relanzarlo lo devuelve a su cola."
            step_5: "Las unidades systemd del servidor se eligen en Ajustes > Sistema. Sin systemd, la línea no aparece."
        tasks:
            title: Tareas programadas
            name: Tarea
            trigger: Ritmo
            last_run: Última ejecución
            next_run: Próxima ejecución
