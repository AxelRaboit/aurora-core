suite:
    health:
        title: État du système
        checked_at: 'Mesuré à {time}'
        refresh: Mesurer à nouveau
        loading: Mesure en cours…
        load_failed: "La mesure n'a pas abouti. Réessayez."
        summary:
            ok: Tout tourne.
            warning: Tout tourne, avec un point à regarder.
            danger: Quelque chose ne tourne pas.
            unknown: Pas encore assez de recul pour tout juger.
        statuses:
            ok: OK
            warning: À regarder
            danger: En panne
            unknown: Pas encore vu
            'off': Non configuré
        sections:
            background: Travail en arrière-plan
            foundations: Ce sur quoi l'application repose
            environment: Environnement
        guide:
            title: Comment ça marche
            step_1: "Chaque ligne est mesurée à l'ouverture de la page, puis à la demande avec « Mesurer à nouveau »."
            step_2: "Le worker écrit un battement toutes les 30 secondes : muet depuis plus de 2 minutes, il est signalé en panne."
            step_3: "Chaque tâche planifiée est jugée sur son propre rythme : une tâche de chaque minute muette depuis 10 minutes est en retard, une tâche de chaque nuit ne l'est pas. Après un déploiement, une tâche est « pas encore vue » jusqu'à son prochain passage."
            step_4: "Un message en échec se relance ou se supprime depuis la liste. Relancer le renvoie dans sa file."
            step_5: "Les unités systemd du serveur se choisissent dans Réglages > Système. Sans systemd, la ligne n'apparaît pas."
        tasks:
            title: Tâches planifiées
            name: Tâche
            trigger: Rythme
            last_run: Dernier passage
            next_run: Prochain passage
            never: Pas encore vue
        failures:
