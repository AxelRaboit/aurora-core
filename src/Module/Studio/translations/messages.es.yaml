# Lo que lee un cliente, en español.
#
# Solo la parte pública: la página del contrato, el formulario de firma, el PDF
# y los correos. El back-office sigue con el repli francés, como en el resto de
# la aplicación desde la 0.9.69, y eso es una decisión: quien administra los
# contratos trabaja en francés, mientras que quien firma no elige el idioma de
# su contrato.
studio:
    contract:
        language:
            fr: francesa
            en: inglesa
            es: española
        governing_language:
            heading: Idioma del contrato
            body: 'El presente contrato se redacta en varios idiomas. En caso de divergencia de interpretación entre las versiones, solo prevalece la versión {language}.'
            translation_notice: 'La versión {language} que usted lee es una traducción facilitada para su comodidad.'
    public:
