        contracts:
            document_guide:
                title: 'Cómo se lee la página de un contrato'
                step_1: 'El recuadro «Siguiente paso» indica en qué punto está el contrato y lleva la acción siguiente; las demás acciones permitidas están en el menú de al lado.'
                step_2: 'En borrador, el documento mostrado es una vista previa con los datos reales: «Editar» cambia las opciones del contrato, «Adaptar el texto» su redacción solo para este cliente.'
                step_3: 'Una vez sellado, el documento mostrado es el texto fijado, y el recuadro del sello confirma que no ha cambiado desde entonces.'
                step_4: 'Junto al documento encontrará los datos del contrato, su enlace de firma, las firmas con su prueba y el historial.'
                step_5: 'Concluido, se descarga en PDF firmado; un contrato original vigente puede después recibir una adenda o rescindirse.'
            guide:
                title: "Cómo avanza un contrato"
                step_1: "Prepárelo como borrador: el cliente, la plantilla, el importe, las fechas y los campos que pida la plantilla."
                step_2: "Séllelo: el texto queda fijado, el contrato recibe su referencia y ya no se modifica."
                step_3: "Envíelo: el cliente recibe por correo un enlace de firma personal, válido {days} días. Un nuevo envío anula el enlace anterior."
                step_4: "El cliente lee, indica su identidad, firma y confirma con un código recibido por correo; también puede rechazarlo."
                step_5: "Contrafirme: el contrato queda concluido y cada parte recibe el PDF firmado. Rechazado, caducado o revocado, vuelve a «Por enviar»."
            wording:
                guide:
                    title: 'Cómo adaptar el texto de un contrato'
                    step_1: 'Este texto solo vale para este contrato: la plantilla y los demás contratos que la usan no cambian.'
                    step_2: 'Modifique el título y el texto y pulse «Guardar»: el primer guardado crea la versión adaptada.'
                    step_3: '«Diferencias con la plantilla» muestra mientras escribe lo que se añade y se quita, y las variables siguen a mano en su panel.'
                    step_4: 'Cuando el contrato tiene un anexo, el cuerpo y el anexo se adaptan por separado, cada uno en su pestaña.'
                    step_5: '«Volver al texto de la plantilla», en el menú, borra la adaptación; una vez sellado el contrato, el texto ya no se modifica.'
