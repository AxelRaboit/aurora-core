        drive:
            settings:
                what_title: 'Qué hace esta conexión'
                what_body: 'Muestra en un espacio los archivos de una carpeta de Drive que el cliente ha compartido. No se copia nada: el archivo se lee en Google en el momento en que alguien lo consulta, y se sirve a un cliente que no tiene cuenta de Google.'
                how_title: 'Cómo activarla'
                how_step_project: 'Cree un proyecto de Google Cloud, con un nombre que lo distinga de sus otros proyectos.'
                how_step_project_link: 'Crear un proyecto'
                how_step_api: 'Active la API de Google Drive en él. Compruebe el selector de proyecto en la parte superior de la consola antes de hacer clic.'
                how_step_api_link: 'Activar la API de Drive'
                how_step_account: 'Cree una cuenta de servicio, sin asignarle ningún rol: su acceso vendrá únicamente de las carpetas que se compartan con ella, y un rol de proyecto solo le concedería más de lo necesario.'
                how_step_account_link: 'Crear una cuenta de servicio'
                how_step_key: 'En su ficha, pestaña Claves, añada una clave en formato JSON. Google descarga el archivo y no lo vuelve a proporcionar nunca: ábralo y pegue todo su contenido a continuación.'
                then_title: 'Después, espacio por espacio'
                then_body: 'Esta clave activa la conexión para toda la aplicación. Cada espacio de cliente designa luego su propia carpeta, en su pestaña Ajustes: pegue ahí la dirección que Drive muestra en la barra del navegador.'
                scope_title: 'Qué puede hacer esta clave'
                scope_body: 'Nada más que leer, y nada más que lo que se le comparte. El token se solicita con el alcance «solo lectura»: incluso una petición de escritura hecha por error sería rechazada por Google. Retirar el uso compartido cierra la puerta sin tocar ningún ajuste aquí.'
                trouble_title: 'Cuando no aparece nada'
                trouble_body: 'Por orden: ¿se ha compartido con la dirección de la cuenta de servicio y no con la suya?; ¿está activada la API de Drive en el proyecto correcto?; ¿está marcada la casilla de abajo? Una carpeta vacía y una carpeta no compartida se ven igual en pantalla, y el espacio indica las dos causas en lugar de suponer una.'
                share_title: 'La dirección con la que compartir'
                share_body: 'En Drive, el cliente comparte su carpeta con esta dirección, como Lector. Lo que no se comparte permanece invisible.'
                key_label: 'Clave de la cuenta de servicio'
                key_hint: 'El archivo JSON completo. Contiene una clave privada: se cifra en la base de datos y no se volverá a mostrar nunca.'
