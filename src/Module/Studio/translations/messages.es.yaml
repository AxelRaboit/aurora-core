            customer:
                label: "Cliente"
                none: "Ningún cliente"
                hint: "Para quién se escribe este entregable, antes de que el cliente tenga un espacio: una propuesta a un cliente potencial. Copiado en un espacio, toma el cliente del espacio."
            studio_guide:
                title: "Cómo funcionan los entregables"
                step_1: "Un entregable se escribe para leerse o presentarse: una auditoría, una estrategia, una propuesta. Una página se compone con la cuadrícula de las páginas, sin aparecer nunca en el sitio; una presentación, diapositiva por diapositiva, o a partir de un texto pegado con «Importar un texto»."
                step_2: "«Personal» solo lo ve usted. «Compartidos» lo lee todo el equipo con acceso a los entregables; lo modifican quienes tienen el derecho, y su autor, aunque no lo tenga."
                step_3: "Un entregable se crea en la pestaña abierta; después, solo su autor lo pasa de personal a compartido, o al revés, desde su menú o sus ajustes."
                step_4: "«Compartir» crea un enlace de lectura que lo envía a quien quiera, con caducidad y contraseña a su elección, sin cuenta ni espacio de cliente. Ver los enlaces y dar alguno requiere el derecho de compartir."
                step_5: "Los entregables de un cliente se preparan en su espacio, pestaña Entregables: allí es donde los lee."
                step_6: "Ordénelos por categoría (auditoría, estrategia, propuesta…): filtre la lista o muéstrela por categoría. Marque «Es un modelo» en los ajustes de un entregable: se ofrece al crear uno, y se copia en el espacio de un cliente. Un entregable de espacio vuelve aquí con «Copiar en Studio»."
