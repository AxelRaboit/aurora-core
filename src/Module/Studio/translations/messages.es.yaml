                then_title: 'Después, espacio por espacio'
                then_body: 'El botón «Importar desde Craft» aparece en la pestaña Notas de cada espacio de cliente. La importación es una copia pura: el documento permanece en Craft, y la nota no seguirá sus cambios.'
