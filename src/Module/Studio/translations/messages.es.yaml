            guide:
                title: "Cómo funcionan los entregables"
                step_1: "«Nuevo entregable» crea una página (auditoría, estrategia, balance) o una presentación, desde cero o a partir de un modelo de Studio, con sus colores o los del cliente."
                step_2: "Permanece oculto al cliente mientras alguien que puede compartir el espacio no haga clic en «Mostrar al cliente»."
                step_3: "«Compartir», en el menú ⋯ de un entregable o en su editor, da a alguien un enlace de lectura, una dirección secreta que abre solo este entregable, sin el espacio."
                step_4: "Un enlace puede tener contraseña y caducidad, y se revoca uno por uno; ocultar el entregable no corta sus enlaces."
                step_5: "«Duplicar» crea una copia oculta al cliente, práctica para partir del balance del mes pasado."
                step_6: "«Copiar a Studio» guarda este entregable como modelo. Los pasajes entre [corchetes] hay que reemplazarlos antes de mostrarlo al cliente: la lista se lo pregunta de nuevo si queda alguno. Los enlaces de lectura requieren el derecho de compartir el espacio."
