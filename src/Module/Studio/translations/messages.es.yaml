                title: 'Cómo leer el calendario'
                step_1: "Reúne en un mismo mes los contenidos de todos sus espacios activos, un color por espacio."
                step_2: '«Mis espacios» o «Todos los espacios» elige lo que se muestra; los espacios archivados no aparecen.'
