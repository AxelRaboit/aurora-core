            guide:
                title: "Comment lire le calendrier"
                step_1: "Il réunit sur un même mois les publications de tous vos espaces actifs, une couleur par espace."
                step_2: "« Mes espaces » ou « Tous les espaces » choisit ce qui est affiché ; les espaces archivés n'y sont pas."
                step_3: "Filtrez par client ou par état : parution manquée, relecture en retard, à reprendre, chez le client, à paraître (sept jours), publié."
                step_4: "En liste, avec un état choisi, toutes les dates sont réunies et les fiches sans date viennent à la fin."
                step_5: "Le calendrier se lit seulement : cliquez sur une fiche pour la modifier dans son espace."
