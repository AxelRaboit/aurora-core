        contracts:
            document_guide:
                title: "Comment se lit la page d'un contrat"
                step_1: "Le cadre « Prochaine étape » dit où en est le contrat et porte le geste suivant ; les autres gestes permis sont dans le menu à côté."
                step_2: "En brouillon, le document affiché est un aperçu avec les vraies données : « Modifier » change les choix du contrat, « Adapter le texte » sa rédaction pour ce client seul."
                step_3: "Une fois scellé, le document affiché est le texte figé, et le cadre du sceau confirme qu'il n'a pas changé depuis."
                step_4: "À côté du document, vous retrouvez les informations du contrat, son lien de signature, les signatures avec leur preuve et l'historique."
                step_5: "Conclu, il se télécharge en PDF signé ; un contrat d'origine en vigueur peut ensuite recevoir un avenant ou être résilié."
            guide:
                title: "Comment se déroule un contrat"
                step_1: "Préparez-le en brouillon : le client, la trame, le montant, les dates et les compléments que la trame demande."
                step_2: "Scellez-le : le texte est figé, le contrat reçoit sa référence et ne se modifie plus."
                step_3: "Envoyez-le : le client reçoit par email un lien de signature personnel, valable {days} jours. Un nouvel envoi annule le lien précédent."
                step_4: "Le client lit, renseigne son identité, signe, puis confirme avec un code reçu par email ; il peut aussi refuser."
                step_5: "Contresignez : le contrat est conclu et chacun reçoit le PDF signé. Refusé, expiré ou révoqué, il revient « À envoyer »."
            wording:
                guide:
                    title: "Comment adapter le texte d'un contrat"
                    step_1: "Ce texte ne vaut que pour ce contrat : la trame et les autres contrats qui l'utilisent ne changent pas."
                    step_2: "Modifiez le titre et le texte, puis « Enregistrer » : le premier enregistrement crée la version adaptée."
                    step_3: "« Différences avec la trame » montre au fil de la frappe ce qui est ajouté et retiré, et les variables restent à portée dans leur panneau."
                    step_4: "Quand le contrat a une annexe, le corps et l'annexe s'adaptent chacun dans son onglet."
                    step_5: "« Revenir au texte de la trame », dans le menu, efface l'adaptation ; une fois le contrat scellé, le texte ne se modifie plus."
