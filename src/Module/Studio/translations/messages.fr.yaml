            customer:
                label: "Client"
                none: "Aucun client"
                hint: "Pour qui ce livrable est écrit, avant que le client ait un espace : une proposition à un prospect. Copié dans un espace, il prend le client de l'espace."
            studio_guide:
                title: "Comment fonctionnent les livrables"
                step_1: "Un livrable s'écrit pour être lu ou présenté : un audit, une stratégie, une proposition. Une page se compose avec la grille des pages, sans jamais être sur le site ; une présentation, diapo par diapo, ou depuis un texte collé avec « Importer un texte »."
                step_2: "« Perso » ne se voit que par vous. « Partagés » se lit par toute l'équipe qui a accès aux livrables ; il se modifie par ceux qui en ont le droit, et par son auteur, même sans ce droit."
                step_3: "Un livrable se crée dans l'onglet ouvert ; ensuite, seul son auteur le fait passer de perso à partagé, ou l'inverse, depuis son menu ou ses réglages."
                step_4: "« Partager » crée un lien de lecture qui l'envoie à qui vous voulez, avec une expiration et un mot de passe au choix, sans compte ni espace client. Voir les liens et en donner demande le droit de partager."
                step_5: "Les livrables d'un client se préparent dans son espace, onglet Livrables : c'est là qu'il les lit."
                step_6: "Rangez-les par catégorie (audit, stratégie, proposition…) : filtrez la liste ou affichez-la par catégorie. Cochez « C'est un modèle » dans les réglages d'un livrable : il est proposé à la création, et se copie dans l'espace d'un client. Un livrable d'espace revient ici par « Copier dans Studio »."
