                step_1: "La colonne « Slides » les montre dans l'ordre : cliquez sur une slide pour la modifier, et déplacez-la par sa poignée ou ses flèches."
                step_2: "« Ajouter une slide » propose les gabarits ; avec « Diapo libre », vous placez chaque élément à la main."
                step_3: "Remplissez les champs du gabarit et les notes d'orateur, que le public ne voit jamais : tout s'enregistre seul."
                step_4: "« Présenter » passe en plein écran ; le menu à côté ouvre la vue présentateur, l'impression, le partage et l'apparence."
            guide:
                title: "Comment fonctionnent les présentations"
                step_1: "Créez une présentation de zéro, à partir d'un modèle, ou en important un document où chaque titre ouvre une slide."
                step_2: "Dans l'éditeur, ajoutez des slides, réordonnez-les et écrivez vos notes d'orateur ; tout s'enregistre seul."
                step_3: "« Présenter » passe en plein écran ; la vue présentateur s'ouvre à côté avec les notes, la slide suivante et un minuteur."
                step_4: "« Partager » crée une adresse secrète qui s'ouvre sans compte, avec une expiration et un mot de passe facultatif."
                step_5: "Les notes d'orateur ne sont jamais montrées par un lien, et un lien se révoque à tout moment."
