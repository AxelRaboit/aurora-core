                step_3: "Le lien expire après 90 jours par défaut ; ses cases règlent ce que le client peut faire : valider, commenter, écrire dans la discussion, envoyer des fichiers, voir le Drive."
                step_4: "« Aperçu » ouvre la page exactement comme ce destinataire la voit, sans rien enregistrer en son nom."
                step_5: "« Révoquer » coupe le lien en gardant sa trace ; « Supprimer » l'efface complètement."
