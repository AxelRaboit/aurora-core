        drive:
            # Le compte de service appartient à l'installation ; le dossier
            # appartient à un client, et c'est lui qui le partage. La portée se
            # décide donc dans Drive, jamais ici.
            settings:
                what_title: Ce que fait cette connexion
                what_body: "Elle affiche dans un espace les fichiers d'un dossier Drive que le client a partagé. Rien n'est recopié : le fichier est lu chez Google au moment où quelqu'un le regarde, et servi à un client qui n'a pas de compte Google."
                how_title: Comment l'ouvrir
                how_step_project: "Créez un projet Google Cloud, nommé distinctement de vos autres projets."
                how_step_project_link: "Créer un projet"
                how_step_api: "Activez l'API Google Drive dessus. Vérifiez le sélecteur de projet en haut de la console avant de cliquer."
                how_step_api_link: "Activer l'API Drive"
                how_step_account: "Créez un compte de service, sans lui donner aucun rôle : son accès viendra uniquement des dossiers qu'on partagera avec lui, et un rôle de projet ne ferait que lui accorder plus que nécessaire."
                how_step_account_link: "Créer un compte de service"
                how_step_key: "Sur sa fiche, onglet Clés, ajoutez une clé au format JSON. Google télécharge le fichier et ne le redonne jamais : ouvrez-le et collez son contenu entier ci-dessous."
                then_title: "Ensuite, espace par espace"
                then_body: "Cette clé ouvre la connexion pour toute l'application. Chaque espace client désigne ensuite son propre dossier, dans son onglet Réglages : collez-y l'adresse que Drive affiche dans la barre du navigateur."
                scope_title: "Ce que cette clé peut faire"
                scope_body: "Rien d'autre que lire, et rien d'autre que ce qu'on lui partage. Le jeton est demandé pour la portée « lecture seule » : même une requête d'écriture écrite par erreur serait refusée par Google. Retirer le partage referme la porte sans toucher à aucun réglage ici."
                trouble_title: "Quand rien n'apparaît"
                trouble_body: "Dans l'ordre : le partage a-t-il été fait avec l'adresse du compte de service et non avec la vôtre ; l'API Drive est-elle activée sur le bon projet ; la case ci-dessous est-elle cochée. Un dossier vide et un dossier non partagé se ressemblent à l'écran, et l'espace nomme les deux causes plutôt que d'en supposer une."
