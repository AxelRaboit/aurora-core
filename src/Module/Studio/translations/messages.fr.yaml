        contract_templates:
            editor_guide:
                title: "Comment rédiger une trame"
                step_1: "Écrivez le titre et le texte langue par langue, dans leurs onglets ; un point vert marque chaque langue rédigée."
                step_2: "Insérez les variables du panneau : chaque contrat les remplace par ses propres données au scellement."
                step_3: "Si plusieurs langues sont rédigées, choisissez la « Langue faisant foi » : sans elle, la version ne peut pas être publiée."
                step_4: "« Enregistrer » garde le brouillon, et « Aperçu », dans le menu, montre le document avec des exemples et vos informations."
                step_5: "« Publier » rend la version définitive ; pour la changer ensuite, « Modifier le texte » ouvre la version suivante en brouillon."
            guide:
                title: "Comment fonctionnent les trames"
                step_1: "Une trame est un corps de contrat, qui se signe seul, ou une annexe, qui complète un corps."
                step_2: "« Modifier le texte » ouvre la version suivante en brouillon : la version en vigueur ne change pas tant que vous ne publiez pas."
                step_3: "Insérez les variables du panneau ; une variable personnalisée (contract.custom suivi d'un nom) crée un champ à remplir sur chaque contrat."
                step_4: "L'aperçu remplace les variables par des exemples et par vos informations tirées des réglages."
                step_5: "Publiez : la version devient définitive et les nouveaux contrats partent de ce texte. Les contrats existants gardent le leur."
