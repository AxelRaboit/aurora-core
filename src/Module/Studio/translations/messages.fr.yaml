        deliverables:
            editor_guide:
                title: "Comment composer un livrable"
                step_1: "« Contenu » se compose avec la grille des pages du site : ajoutez des zones et remplissez-les."
                step_2: "« Apparence » règle les couleurs de la page et du contenu pour ce livrable seul, aux couleurs du client si vous voulez."
                step_3: "« Réglages » porte le titre, le résumé, la langue et l'en-tête ; cochez « Visible par le client » pour qu'il le lise dans son espace, avec le droit de partager l'espace."
                step_4: "Enregistrez vos modifications, puis « Aperçu », dans le menu, ouvre la page telle que le client la lira."
                step_5: "« Partager » crée un lien de lecture, une adresse secrète qui ouvre ce seul livrable sans compte, avec un mot de passe et une expiration facultatifs."
                step_3_studio: "« Réglages » porte le titre, le résumé, la langue et l'en-tête, et sa visibilité : perso ou partagé."
                step_4_studio: "Enregistrez vos modifications, puis « Aperçu », dans le menu, ouvre la page telle que la lira son destinataire."
                step_6: "Dans le menu, « Exporter en PDF » donne une page par diapo. Les passages entre [crochets] sont à remplacer avant de montrer le livrable au client : un compteur les suit."
                step_6_studio: "Dans le menu, « Exporter en PDF » donne une page par diapo. Les passages entre [crochets] sont à remplacer avant de l'envoyer : un compteur les suit."
            guide:
                title: "Comment fonctionnent les livrables"
                step_1: "« Nouveau livrable » crée une page (audit, stratégie, bilan) ou une présentation, de zéro ou à partir d'un modèle de Studio, à vos couleurs ou à celles du client."
                step_2: "Il reste caché au client tant que quelqu'un qui peut partager l'espace ne clique pas sur « Montrer au client »."
                step_3: "« Partager », dans le menu ⋯ d'un livrable ou dans son éditeur, donne à quelqu'un un lien de lecture, une adresse secrète qui ouvre ce seul livrable, sans l'espace."
                step_4: "Un lien peut avoir un mot de passe et une expiration, et se révoque un par un ; cacher le livrable ne coupe pas ses liens."
                step_5: "« Dupliquer » crée une copie cachée au client, pratique pour repartir du bilan du mois dernier."
                step_6: "« Copier dans Studio » garde ce livrable comme modèle. Les passages entre [crochets] sont à remplacer avant de le montrer au client : la liste vous le redemande s'il en reste. Les liens de lecture demandent le droit de partager l'espace."
