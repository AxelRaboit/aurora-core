                refresh_confirm: "Remettre « {title} » sur la version actuelle du document Craft ?"
                refresh_warning: "Le corps de la note est remplacé. Ce que vous avez modifié ici sera perdu ; la couleur, l'épingle et la visibilité sont conservées."
