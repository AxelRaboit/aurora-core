            guide:
                title: "Comment lire le calendrier"
                step_1: "Il réunit sur un même mois les contenus de tous vos espaces actifs, une couleur par espace."
                step_2: "« Mes espaces » ou « Tous les espaces » choisit ce qui est affiché ; les espaces archivés n'y sont pas."
                step_3: "Filtrez par client ou par état : parution manquée, relecture en retard, à revoir, chez le client, à paraître (sept jours), publié."
                step_4: "En liste, avec un état choisi, toutes les dates sont réunies et les contenus sans date viennent à la fin."
                step_5: "Le calendrier se lit seulement : cliquez sur un contenu pour le modifier dans son espace."
