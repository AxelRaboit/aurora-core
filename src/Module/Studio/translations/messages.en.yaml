                step_2: "Insert the variables from the panel: each contract replaces them with its own data when it is sealed."
                step_3: "If several languages are written, choose the “Governing language”: without it, the version cannot be published."
                step_4: "“Save” keeps the draft, and “Preview”, in the menu, shows the document with examples and your own details."
                step_5: "“Publish” makes the version final; to change it afterwards, “Edit the text” opens the next version as a draft."
            guide:
                title: "How templates work"
                step_1: "A template is a contract body, signed on its own, or an appendix, which completes a body."
                step_2: "“Edit the text” opens the next version as a draft: the version in force does not change until you publish."
                step_3: "Insert variables from the panel; a custom variable (contract.custom followed by a name) creates a field to fill in on each contract."
                step_4: "The preview replaces variables with examples and with your details taken from the settings."
                step_5: "Publish: the version becomes final and new contracts start from this text. Existing contracts keep theirs."
