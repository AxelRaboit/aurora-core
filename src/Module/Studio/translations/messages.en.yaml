        decks:
            editor_guide:
                title: "How to edit a presentation"
                step_1: "The “Slides” column shows them in order: click a slide to edit it, and move it by its handle or its arrows."
                step_2: "“Add a slide” offers the layouts; with “Free slide”, you place each element by hand."
                step_3: "Fill in the layout's fields and the speaker notes, which the audience never sees: everything saves on its own."
                step_4: "“Present” goes full screen; the menu beside it opens the presenter view, printing, sharing and the appearance."
            guide:
                title: "How presentations work"
                step_1: "Create a presentation from scratch, from a template, or by importing a document where each heading opens a slide."
                step_2: "In the editor, add slides, reorder them and write your speaker notes; everything saves on its own."
                step_3: "“Present” goes full screen; the presenter view opens alongside with the notes, the next slide and a timer."
                step_4: "“Share” creates a secret address that opens without an account, with an expiry and an optional password."
                step_5: "Speaker notes are never shown through a link, and a link can be revoked at any time."
