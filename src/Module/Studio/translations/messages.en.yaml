                title: "How to put a deliverable together"
                step_1: "“Content” is built with the site's page grid: add zones and fill them in."
                step_2: "“Appearance” sets the page and content colours for this document alone, in the client's colours if you like."
                step_3: "“Settings” holds the title, the summary, the language and the header; tick “Visible to the client” so they can read it in their space."
