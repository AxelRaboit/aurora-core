        contracts:
            document_guide:
                title: "How to read a contract's page"
                step_1: "The “Next step” card says where the contract stands and carries the next action; the other allowed actions are in the menu beside it."
                step_2: "As a draft, the document shown is a preview with the real data: “Edit” changes the contract's choices, “Adapt the wording” its text for this client alone."
                step_3: "Once sealed, the document shown is the frozen text, and the seal card confirms it has not changed since."
                step_4: "Beside the document you find the contract's details, its signing link, the signatures with their proof and the history."
                step_5: "Once concluded, it downloads as a signed PDF; an original contract in force can then receive an amendment or be terminated."
            guide:
                title: "How a contract goes"
                step_1: "Prepare it as a draft: the client, the template, the amount, the dates and the extra fields the template asks for."
                step_2: "Seal it: the text is frozen, the contract gets its reference and can no longer be edited."
                step_3: "Send it: the client gets a personal signing link by email, valid thirty days. A new send cancels the previous link."
                step_4: "The client reads, fills in their identity, signs, then confirms with a code sent by email; they can also decline."
                step_5: "Countersign: the contract is concluded and both parties get the signed PDF. Declined, expired or revoked, it goes back to “To send”."
            wording:
                guide:
                    title: "How to adapt a contract's wording"
                    step_1: "This wording applies to this contract only: the template and the other contracts using it do not change."
                    step_2: "Edit the title and the text, then “Save”: the first save creates the adapted version."
                    step_3: "“Differences with the template” shows what is added and removed as you type, and the variables stay within reach in their panel."
                    step_4: "When the contract has an annex, the body and the annex are adapted separately, each in its own tab."
                    step_5: "“Back to the template's wording”, in the menu, removes the adaptation; once the contract is sealed, the text can no longer change."
