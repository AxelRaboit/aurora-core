studio:
    contract:
        # Written into the document itself, and therefore sealed with it: these
        # sentences end up in the rendered HTML, not in the page around it.
        language:
            fr: French
            en: English
            es: Spanish
        governing_language:
            heading: Language of the contract
            body: 'This contract is drawn up in several languages. Should the versions diverge in interpretation, only the {language} version prevails.'
            translation_notice: 'The {language} version you are reading is a translation provided for your convenience.'
    public:
        contract:
            title: Contract
            heading: Service agreement
            intro: 'This document is addressed to you on behalf of {company}. Take the time to read it in full.'
            to_sign: This contract is waiting for your signature.
            to_sign_hint: You will be asked for your first and last name, your email, the place and the date, then your signature. A confirmation code will be sent to your email address.
            valid_until: 'This link is valid until {date}.'
            signed: You have signed this contract.
            signed_hint: Nothing more is asked of you. You will receive the countersigned document by email.
            concluded: This contract is signed by both parties.
            hash_notice: 'Document hash: {hash}. It guarantees this wording has not changed since it was sent.'
            footer: This link is personal to you. Please do not forward it.
            refused: You have declined to sign this contract.
            refused_hint: 'Refusal recorded on {date}. If that was a mistake, tell the provider: they can send the contract again.'
        privacy:
            title: 'Your data: what is collected and why'
            controller: 'Data controller: {controller}.'
            collected_title: 'What this page records'
            collected_declared: 'What you type: name, first name, email address, place and date of signature, and the drawing of your signature.'
            collected_observed: 'What the server observes as you sign: the date and time, your IP address, your browser, and the verification of the code sent by email.'
            collected_refusal: 'If you decline to sign: the date, your IP address, your browser, and the reason if you give one.'
            basis_title: 'Why, and on what basis'
            basis_contract: 'Your identity and your signature are used to conclude and perform the contract (art. 6.1.b GDPR).'
            basis_proof: 'The observed items are used to prove that the signature is yours and that the document has not changed. That is the provider''s legitimate interest in being able to defend the contract (art. 6.1.f), and what the law expects of an electronic signature.'
            retention: 'This data is kept for {years} years from the sealing of the contract, because a contract has to stay provable for as long as it can be disputed. After that, it can be deleted.'
            no_transfer: 'Nothing is passed to a third party for commercial purposes, and nothing is used to profile you. The contract and its evidence stay with the provider.'
            rights: 'You may request access to your data, its rectification, its erasure and its portability, and object to its processing. Erasure cannot cover what proves a contract that is still enforceable, for as long as the period above runs.'
            rights_contact: 'To do so, write to {email}.'
            complaint: 'If an answer does not satisfy you, you may lodge a complaint with the CNIL.'
        refuse:
            trigger: 'I am not signing'
            heading: 'Decline this contract'
            intro: 'You are not obliged to sign. Your refusal goes to the provider, who can send the contract again if you change your mind.'
            reason: 'Reason (optional)'
            reason_placeholder: 'Anything you want to say about it, if you want to.'
            reason_hint: 'Optional. Nothing obliges you to justify a refusal.'
            submit: 'Confirm my refusal'
            cancel: 'Back to the contract'
            done: 'Your refusal has been recorded.'
            errors:
                reason_too_long: 'That reason is too long.'
        sign:
            heading: 'Sign this contract'
            intro: 'Fill in your details, sign in the frame, then confirm with the code we will email you.'
            first_name: 'First name'
            first_name_placeholder: 'Camille'
            last_name: 'Last name'
            last_name_placeholder: 'Durand'
            email: 'Your email'
            email_placeholder: 'camille@company.com'
            email_hint: 'Your own address. The confirmation code goes to the company''s contractual address.'
            place: 'Signed at'
            place_placeholder: 'Lyon'
            date: 'On'
            date_placeholder: '2026-09-09'
            signature: 'Your signature'
