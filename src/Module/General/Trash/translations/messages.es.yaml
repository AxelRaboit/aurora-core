            step_1: "Lo que se elimina en publicaciones, la mediateca (documentos, carpetas, categorías), notas, entregables y presentaciones espera aquí, una pestaña por tipo."
            step_2: "Restaurar devuelve el elemento a su sitio; si ese sitio ya no existe, una carpeta vuelve a la raíz."
