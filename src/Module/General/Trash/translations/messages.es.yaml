suite:
    trash:
        guide:
            title: "Cómo funciona la papelera"
            step_1: "Lo que se elimina en publicaciones, la mediateca (documentos, carpetas, categorías), notas, espacios de cliente y sus contenidos, y entregables (páginas y presentaciones) espera aquí, ordenado por módulo y luego por tipo."
            step_2: "Restaurar devuelve el elemento a su sitio cuando todavía es posible: una carpeta cuyo padre se eliminó vuelve a la raíz, una categoría cuyo nombre se ha reutilizado recibe un nombre libre."
            step_3: "Cada elemento se va definitivamente tras el plazo fijado (treinta días por defecto), durante la purga nocturna."
            step_4: "«Eliminar definitivamente» y «Vaciar» no se deshacen; los comentarios, menús, formularios y cuentas nunca pasan por aquí."
