suite:
    trash:
        guide:
            title: "Comment fonctionne la corbeille"
            step_1: "Ce qui est supprimé dans les publications, la médiathèque (documents, dossiers, catégories), les notes et les livrables (pages et présentations) attend ici, un onglet par type."
            step_2: "Restaurer remet l'élément à sa place ; si sa place n'existe plus, un dossier revient à la racine."
            step_3: "Chaque élément part définitivement après le délai réglé (trente jours par défaut), lors de la purge de la nuit."
            step_4: "« Supprimer définitivement » et « Vider » ne se défont pas ; les commentaires, menus, formulaires et comptes ne passent jamais par ici."
        title: "Corbeille"
        intro: "Tout ce qui a été supprimé attend ici, quel que soit le module, et se restaure d'ici."
        retention: "Une ligne part définitivement {days} jours après sa suppression."
        retention_off: "La purge automatique est désactivée : rien ne part tout seul."
        rules_note: "Restaurer remet l'élément là où il était, quand c'est encore possible : un dossier dont le parent est supprimé revient à la racine, une catégorie dont le nom a été repris reçoit un nom libre."
        count: "1 élément | {count} éléments"
        empty_one: "Cette corbeille est vide."
        open_list: "Ouvrir {list}"
        days_left: "purge dans 1 jour | purge dans {count} jours"
        purge_due: "purge cette nuit"
        deleted_on: "supprimé le {date}"
        restore: "Restaurer"
        restored: "Élément restauré."
        delete_forever: "Supprimer définitivement"
        delete_forever_confirm: "Supprimer définitivement « {name} » ? C'est le seul geste de cette page qui ne se défait pas."
        deleted_forever: "Élément supprimé définitivement."
        empty: "Vider"
        empty_confirm: "Vider cette corbeille supprimera définitivement ses {count} éléments. C'est sans retour."
        emptied: "{count} élément(s) supprimé(s) définitivement."
