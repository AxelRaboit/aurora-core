suite:
    trash:
        guide:
            title: "Comment fonctionne la corbeille"
            step_1: "Ce qui est supprimé dans les publications, la médiathèque (documents, dossiers, catégories), les notes, les espaces clients et leurs contenus, et les livrables (pages et présentations) attend ici, rangé par module puis par type."
            step_2: "Restaurer remet l'élément à sa place quand c'est encore possible : un dossier dont le parent est supprimé revient à la racine, une catégorie dont le nom a été repris reçoit un nom libre."
            step_3: "Chaque élément part définitivement après le délai réglé (trente jours par défaut), lors de la purge de la nuit."
            step_4: "« Supprimer définitivement » et « Vider » ne se défont pas ; les commentaires, menus, formulaires et comptes ne passent jamais par ici."
