    post_galleries:
        editor_guide:
            title: "Cómo se compone la galería"
            step_1: "Active la galería para mostrarla bajo el contenido de la publicación y elija su disposición, sus columnas y su proporción."
            step_2: "«Añadir una imagen» toma una de la mediateca o de su ordenador, e «Importar imágenes» envía varias a la vez, sesenta como máximo."
            step_3: "Arrastre una imagen o use sus flechas para cambiar el orden, que es el mismo en todos los idiomas."
            step_4: "«Texto de la imagen» define su texto alternativo y su leyenda en cada idioma; si se deja vacío, el texto alternativo viene de la mediateca."
            step_5: "No se guarda nada hasta que pulse «Guardar»."
        guide:
            title: 'Cómo se llenan las galerías'
            step_1: 'Cada publicación puede llevar una galería de imágenes, mostrada bajo su contenido una vez activada.'
            step_2: 'La lista muestra cuántas fotos tiene cada publicación: «Ninguna foto» señala las que quedan por llenar.'
            step_3: '«Galería» abre solo las imágenes de la publicación: su texto, su estado y su posicionamiento no cambian allí.'
            step_4: 'Aquí ve todas las publicaciones, también las de otros autores, salvo las de la papelera.'
