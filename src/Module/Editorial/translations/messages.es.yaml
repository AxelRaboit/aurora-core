    forms:
        editor_guide:
            title: "Cómo se configura este formulario"
            step_1: "En «Preguntas», añada una pregunta eligiendo su tipo y luego haga clic en ella para modificarla; la vista previa muestra lo que verá el visitante."
            step_2: "«Dividir en pasos» reparte las preguntas en varias páginas, y una pregunta puede mostrarse solo según la respuesta a una pregunta situada antes."
            step_3: "«Respuestas» lista los envíos, los más recientes primero, y «Exportar en CSV» los recoge todos para una hoja de cálculo."
            step_4: "«Ajustes» fija el título y la dirección en cada idioma, pone el formulario en línea o fuera de línea y elige a quién se avisa de cada respuesta."
            step_5: "Sin dirección de correo, cada respuesta se envía al administrador del sitio; fuera de línea, el formulario desaparece de las páginas donde está colocado."
        guide:
            title: "Cómo funcionan los formularios"
            step_1: "Cree un formulario a partir de una plantilla: vacío, contacto, solicitud de presupuesto en dos pasos, inscripción a un evento."
            step_2: "En «Preguntas», añádalas en el orden en que las verá el visitante, divididas en pasos si hace falta; una pregunta puede depender de una respuesta anterior."
            step_3: "Las respuestas llegan a «Respuestas», exportables en CSV; «Ajustes» también puede avisarle por correo o enviarlas a un webhook."
            step_4: "Para mostrarlo, añada una zona «Formulario» en la cuadrícula de una publicación; fuera de línea, desaparece de todas las páginas."
            step_5: "Eliminar un formulario es definitivo y se lleva sus respuestas: no pasa por la papelera."
