        useful_links:
            settings:
                guide:
                    title: 'Cómo funcionan los enlaces útiles'
                    step_1: 'Añada un enlace con su texto, su dirección y su color; la dirección empieza por https:// o mailto:.'
                    step_2: 'Arrastre el asa para cambiar el orden y luego guarde: un enlace sin texto o sin una dirección válida se retira al guardar.'
                    step_3: 'Aparecen al pie de cada publicación, junto a los botones para compartir cuando están activos.'
                    step_4: 'En la pestaña Ajustes de una publicación, puede ocultarlos o sustituirlos por enlaces propios.'
                title: 'Los enlaces útiles del sitio'
                intro: 'Se definen una vez aquí y aparecen al pie de cada publicación, junto a «Compartir»: dónde encontrar al autor, el producto, el código. Una publicación puede ocultarlos o tener los suyos, en su pestaña Ajustes.'
        newsletter:
            settings:
                what_title: 'Qué hace esta integración'
                what_body: 'Desde una zona «Suscripción al boletín» colocada en una página, añade la dirección de un visitante a la lista del cliente en Brevo o Mailchimp.'
                provider_label: Proveedor
                providers:
                    brevo: Brevo
                    mailchimp: Mailchimp
                how_title: 'Cómo activarla'
                how_brevo: 'En Brevo, la clave de API se encuentra en Ajustes de la cuenta > Claves API. El identificador de la lista aparece en la propia página de la lista.'
                how_mailchimp: 'En Mailchimp, la clave de API se crea en Cuenta > Extras > Claves API. El identificador de la audiencia (lista) se encuentra en sus ajustes.'
                terms_label: 'He leído y acepto las condiciones del proveedor elegido'
                terms_hint: 'La dirección de un visitante se envía al proveedor elegido, con la cuenta propia del cliente.'
                accepted_on: 'Aceptado el {date} por {user}.'
                list_label_brevo: 'Identificador de la lista'
                list_label_mailchimp: 'Identificador de la audiencia'
                key_label: 'Clave de API'
                key_stored: 'Hay una clave guardada.'
                key_hint: 'Pegue aquí la clave de la cuenta del cliente.'
                enabled_label: 'Mostrar la suscripción al boletín'
                enabled_hint: 'Las zonas «Suscripción al boletín» de las páginas añaden una dirección a esta lista.'
                enabled_blocked: 'Indique la lista, la clave y la política de privacidad, y acepte las condiciones, para activar la integración.'
                compliance_title: 'Cumplimiento (RGPD)'
                compliance_body: 'El formulario siempre pide al visitante que marque una casilla de consentimiento y le indica, bajo el campo, para qué sirve su dirección, a quién se transmite y cómo darse de baja.'
                double_opt_in_label: 'Confirmación por correo electrónico (recomendado)'
                double_opt_in_hint: 'El visitante recibe un correo electrónico y solo se añade a la lista después de hacer clic en el enlace. Nadie puede suscribir la dirección de otra persona, y el proveedor conserva la prueba del consentimiento.'
                brevo_template_label: 'Plantilla de correo de confirmación (Brevo)'
                brevo_template_hint: 'Brevo la exige para enviar la confirmación: cree una plantilla en Campañas > Plantillas, con la etiqueta «optin» y el enlace de confirmación «doubleoptin» que propone Brevo, y luego indique aquí su número.'
                privacy_label: 'Dirección de la política de privacidad'
                privacy_hint: 'Obligatorio: el enlace aparece bajo el formulario. Una dirección https:// o una ruta del sitio, por ejemplo /fr/page/confidentialite. Debe mencionar al proveedor de envío.'
