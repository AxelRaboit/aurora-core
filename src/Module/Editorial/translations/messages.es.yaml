    taxonomies:
        guide:
            title: "Cómo funcionan las taxonomías"
            step_1: "Una taxonomía clasifica las publicaciones en categorías o etiquetas; elíjala en el menú lateral para ver sus términos."
            step_2: "«Se aplica a» elige los tipos de contenido afectados: sus publicaciones marcan sus términos en la pestaña Ajustes."
            step_3: "Con «Términos anidados», un término se coloca bajo un padre como una categoría; sin ella, los términos quedan en un solo nivel como etiquetas."
            step_4: "Cada término tiene un nombre y un slug por idioma, y su página en el sitio lista las publicaciones publicadas que lo llevan a él o a uno de sus hijos."
            step_5: "Eliminar un término sube a sus hijos un nivel; eliminar una taxonomía se lleva sus términos, y una taxonomía nativa no se puede eliminar."
