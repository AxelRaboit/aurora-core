                what_title: 'Qué hace esta integración'
                what_body: 'Muestra, en una zona «Actividad de GitHub» colocada en una página, la cuadrícula de contribuciones de las cuentas indicadas abajo: una casilla por día durante los últimos doce meses, como en un perfil de GitHub.'
