                source_body: 'De la página pública de cada perfil, la que cualquier visitante puede abrir: ninguna clave, ninguna cuenta que conectar. Las cuadrículas se vuelven a leer cada seis horas. Si GitHub no responde, se sigue mostrando la última cuadrícula leída.'
                logins_label: 'Cuentas de GitHub'
                logins_hint: 'Un identificador por línea, en orden de visualización, cuatro como máximo. La «@» es opcional.'
