    post_types:
        guide:
            title: 'Cómo funcionan los tipos de contenido'
            step_1: 'Un tipo de contenido agrupa publicaciones de la misma naturaleza, como artículos o servicios; elíjalo en el menú lateral para ver sus ajustes.'
            step_2: 'Sus publicaciones tienen su dirección bajo su slug, y «Tiene una página de lista» añade en el sitio una página que las lista todas.'
            step_3: 'Las capacidades activan en sus publicaciones el contenido en bloques, la imagen destacada o la lectura en secuencia.'
            step_4: 'Los campos personalizados añaden casillas que rellenar en cada publicación del tipo, comunes a todos los idiomas o propias de cada uno con «Por idioma».'
            step_5: 'Un tipo nativo conserva su slug y no se puede eliminar; los demás solo se eliminan cuando ya no tienen ninguna publicación, papelera incluida.'
