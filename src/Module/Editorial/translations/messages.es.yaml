    posts:
        settings_guide:
            title: "Cómo se configura la difusión"
            step_1: "El estado decide si la página se puede leer: «Borrador» la deja en la administración, «Publicada» la pone en línea, «Programada» la publica sola en la fecha elegida."
            step_2: "«En el sitio» la muestra en las listas, los menús, la búsqueda y el sitemap; «Solo con enlace» no la muestra en ningún sitio y se lee con un enlace de lectura."
            step_3: "Con el permiso de publicar, «Enlaces de lectura» crea una dirección secreta por destinatario, que solo se abre cuando la publicación está publicada."
            step_4: "«Despublicar el» pasa una publicación en línea a «Archivada» en la fecha elegida; si se deja vacío, sigue en línea."
            step_5: "«Vista previa» guarda y luego abre una dirección secreta válida siete días, e «Historial» restaura una versión guardada anteriormente."
        guide:
            title: "Cómo se publica una página"
            step_1: "Una publicación empieza como borrador: solo es visible en la administración."
            step_2: "«Publicada» la pone en línea; «Programada», con una fecha, la publica sola en el minuto previsto."
            step_3: "Sin el derecho a publicar, elegir «Publicada» o «Programada» la deja «Pendiente de revisión»: aprobada, sale en la fecha elegida; si no, vuelve a borrador."
            step_4: "«En el sitio» la muestra en las listas, los menús y la búsqueda; «Solo enlace» no la muestra en ningún sitio y se comparte con un enlace de lectura."
            step_5: "Cada guardado conserva una versión (veinte por defecto), y «Previsualizar» da una dirección secreta válida siete días."
