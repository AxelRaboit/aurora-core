    posts:
        settings_guide:
            title: "Comment se règle la diffusion"
            step_1: "Le statut décide si la page se lit : « Brouillon » la garde dans l'administration, « Publiée » la met en ligne, « Programmée » la publie toute seule à la date choisie."
            step_2: "« Sur le site » la montre dans les listes, les menus, la recherche et le sitemap ; « Lien seulement » ne la montre nulle part et se lit par un lien de lecture."
            step_3: "Avec le droit de publier, « Liens de lecture » crée une adresse secrète par destinataire, qui ne s'ouvre que lorsque la publication est publiée."
            step_4: "« Dépublier le » fait passer une publication en ligne en « Archivée » à la date choisie ; laissé vide, elle reste en ligne."
            step_5: "« Prévisualiser » enregistre puis ouvre une adresse secrète valable sept jours, et « Historique » restaure une version enregistrée auparavant."
        guide:
            title: "Comment se publie une page"
            step_1: "Une publication commence en brouillon : elle n'est visible que dans l'administration."
            step_2: "« Publiée » la met en ligne ; « Programmée », avec une date, la publie toute seule à la minute prévue."
            step_3: "Sans le droit de publier, choisir « Publiée » ou « Programmée » la met « En attente de revue » : approuvée, elle part à la date voulue, sinon elle revient en brouillon."
            step_4: "« Sur le site » la montre dans les listes, les menus et la recherche ; « Lien seulement » ne la montre nulle part et se partage par un lien de lecture."
            step_5: "Chaque enregistrement garde une version (vingt par défaut), et « Prévisualiser » donne une adresse secrète valable sept jours."
