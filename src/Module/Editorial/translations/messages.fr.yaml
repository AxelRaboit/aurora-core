    forms:
        editor_guide:
            title: "Comment se règle ce formulaire"
            step_1: "Dans « Questions », ajoutez une question en choisissant son type, puis cliquez dessus pour la modifier ; l'aperçu montre ce que verra le visiteur."
            step_2: "« Découper en étapes » répartit les questions sur plusieurs pages, et une question peut ne s'afficher que selon la réponse à une question placée avant elle."
            step_3: "« Réponses » liste les envois, les plus récents en premier, et « Exporter en CSV » les reprend tous pour un tableur."
            step_4: "« Réglages » donne le titre et l'adresse dans chaque langue, met le formulaire en ligne ou hors ligne, et choisit qui est prévenu de chaque réponse."
            step_5: "Sans adresse de courriel, chaque réponse est envoyée à l'administrateur du site ; hors ligne, le formulaire disparaît des pages où il est posé."
        guide:
            title: "Comment fonctionnent les formulaires"
            step_1: "Créez un formulaire à partir d'un modèle : vide, contact, demande de devis en deux étapes, inscription à un événement."
            step_2: "Dans « Questions », ajoutez-les dans l'ordre où le visiteur les verra, découpées en étapes si besoin ; une question peut dépendre d'une réponse précédente."
            step_3: "Les réponses arrivent dans « Réponses », exportables en CSV ; « Réglages » peut aussi vous prévenir par courriel ou les envoyer à un webhook."
            step_4: "Pour l'afficher, ajoutez une zone « Formulaire » dans la grille d'une publication ; hors ligne, il disparaît de toutes les pages."
            step_5: "Supprimer un formulaire est définitif et emporte ses réponses : il ne passe pas par la corbeille."
