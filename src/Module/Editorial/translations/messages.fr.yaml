    taxonomies:
        guide:
            title: "Comment fonctionnent les taxonomies"
            step_1: "Une taxonomie classe les publications en catégories ou en étiquettes ; choisissez-la dans le menu latéral pour voir ses termes."
            step_2: "« S'applique à » choisit les types de contenu concernés : leurs publications cochent ses termes dans l'onglet Paramétrage."
            step_3: "Avec « Termes imbriqués », un terme se range sous un parent comme une catégorie ; sans, les termes restent sur un seul niveau comme des étiquettes."
            step_4: "Chaque terme a un nom et un slug par langue, et sa page sur le site liste les publications publiées qui le portent, lui ou l'un de ses enfants."
            step_5: "Supprimer un terme fait remonter ses enfants d'un niveau ; supprimer une taxonomie emporte ses termes, et une taxonomie native ne se supprime pas."
