    post_galleries:
        editor_guide:
            title: "Comment se compose la galerie"
            step_1: "Activez la galerie pour l'afficher sous le contenu de la publication, puis choisissez sa disposition, ses colonnes et son rapport."
            step_2: "« Ajouter une image » en prend une dans la médiathèque ou sur votre ordinateur, et « Importer des images » en envoie plusieurs d'un coup, soixante au plus."
            step_3: "Glissez une image ou utilisez ses flèches pour changer l'ordre, qui est le même dans toutes les langues."
            step_4: "« Texte de l'image » donne son texte alternatif et sa légende dans chaque langue ; laissé vide, le texte alternatif vient de la médiathèque."
            step_5: "Rien n'est gardé tant que vous n'avez pas cliqué sur « Enregistrer »."
        guide:
            title: "Comment se remplissent les galeries"
            step_1: "Chaque publication peut porter une galerie d'images, affichée sous son contenu une fois activée."
            step_2: "La liste montre combien de photos compte chaque publication : « Aucune photo » repère celles qui restent à remplir."
            step_3: "« Galerie » ouvre seulement les images de la publication : son texte, son statut et son référencement n'y changent pas."
            step_4: "Vous y voyez toutes les publications, y compris celles des autres auteurs, hors corbeille."
