    post_types:
        guide:
            title: "Comment fonctionnent les types de contenu"
            step_1: "Un type de contenu regroupe des publications de même nature, comme des articles ou des services ; choisissez-le dans le menu latéral pour voir ses réglages."
            step_2: "Ses publications ont leur adresse sous son slug, et « Possède une page de liste » ajoute sur le site une page qui les liste toutes."
            step_3: "Les capacités ouvrent à ses publications le contenu en blocs, l'image à la une ou la lecture en séquence."
            step_4: "Les champs personnalisés ajoutent des cases à remplir dans chaque publication du type, communes à toutes les langues ou propres à chacune avec « Par langue »."
            step_5: "Un type natif garde son slug et ne se supprime pas ; un autre type ne se supprime que s'il ne porte plus aucune publication, corbeille comprise."
