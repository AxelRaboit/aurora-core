  editorial:
    github:
      settings:
        what_title: Ce que fait cette intégration
        what_body: "Elle affiche, dans une zone « Activité GitHub » posée sur une page, la grille de contributions des comptes ci-dessous : une case par jour sur les douze derniers mois, comme sur un profil GitHub."
        source_title: D'où viennent les données
        source_body: "De la page publique de chaque profil, celle que n'importe quel visiteur peut ouvrir : aucune clé, aucun compte à brancher. Les grilles sont relues toutes les six heures. Si GitHub ne répond pas, la dernière grille lue reste affichée."
        logins_label: Comptes GitHub
        logins_hint: "Un identifiant par ligne, dans l'ordre d'affichage, quatre au plus. Le « @ » est facultatif."
        enabled_label: Afficher l'activité GitHub
        enabled_hint: "Les zones « Activité GitHub » des pages affichent ces comptes."
        enabled_blocked: "Saisissez au moins un compte pour activer l'intégration."
      errors:
        invalid_login: "Identifiant GitHub invalide : {logins}. Lettres, chiffres et tirets seulement."
        too_many: "{max} comptes au plus."
        logins_required: "Saisissez au moins un compte pour activer l'intégration."
    instagram:
      settings:
        what_title: Ce que fait cette intégration
        what_body: "Elle affiche, dans une zone « Fil Instagram » posée sur une page, les publications récentes du compte professionnel du client."
        how_title: Comment l'ouvrir
        how_step_business: "Le compte Instagram doit être un compte professionnel ou créateur, relié à une page Facebook."
        how_step_app: "Dans Meta for Developers, créez une application et ajoutez-lui le produit « Instagram API »."
        how_step_token: "Générez un jeton d'accès longue durée pour ce compte, depuis cette application."
        how_step_paste: "Copiez l'identifiant du compte professionnel et le jeton, et collez-les ci-dessous."
        how_link: Documentation Meta
        terms_label: J'ai lu et j'accepte les conditions de la plateforme Meta
        terms_hint: "Le fil affiche des publications qui restent la propriété du compte : rien n'est copié ni republié ailleurs."
        terms_link: Conditions de la plateforme Meta
        accepted_on: "Accepté le {date} par {user}."
        business_id_label: Identifiant du compte professionnel
        business_id_hint: "Le numéro Instagram Business Account, pas le nom d'utilisateur."
        token_label: Jeton d'accès
        token_stored: Un jeton est enregistré.
        token_hint: Collez ici le jeton longue durée généré pour ce compte.
        enabled_label: Afficher le fil Instagram
        enabled_hint: "Les zones « Fil Instagram » des pages affichent ce compte."
        enabled_blocked: "Renseignez le compte, le jeton et acceptez les conditions pour activer l'intégration."
      errors:
        terms_required: "Vous devez accepter les conditions de la plateforme Meta pour activer l'intégration."
        account_required: "Saisissez l'identifiant du compte et le jeton d'accès pour activer l'intégration."
    google_reviews:
      settings:
        what_title: Ce que fait cette intégration
        what_body: "Elle affiche, dans une zone « Avis Google » posée sur une page, la note et les derniers avis de la fiche d'établissement du client."
        how_title: Comment l'ouvrir
        how_step_console: "Créez une clé d'API dans la Google Cloud Console du client, restreinte à l'API Places."
        how_step_key: "Copiez cette clé et collez-la ci-dessous."
        how_step_place: "Retrouvez l'identifiant de la fiche d'établissement (Place ID) et collez-le aussi."
        how_link: Trouver un Place ID
        terms_label: J'ai lu et j'accepte les conditions de Google Maps Platform
        terms_hint: "Les avis affichés restent ceux de la fiche Google : rien n'est copié ni modifié."
        terms_link: Conditions de Google Maps Platform
        accepted_on: "Accepté le {date} par {user}."
        place_label: Identifiant de la fiche (Place ID)
        place_hint: "Celui de l'établissement du client, jamais un autre."
        key_label: Clé d'API
        key_stored: Une clé est enregistrée.
        key_hint: Collez ici la clé Places API du client.
        enabled_label: Afficher les avis Google
        enabled_hint: "Les zones « Avis Google » des pages affichent cette fiche."
        enabled_blocked: "Renseignez la fiche, la clé et acceptez les conditions pour activer l'intégration."
      errors:
        terms_required: "Vous devez accepter les conditions de Google Maps Platform pour activer l'intégration."
        place_required: "Saisissez l'identifiant de la fiche et la clé d'API pour activer l'intégration."
    newsletter:
      settings:
        what_title: Ce que fait cette intégration
        what_body: "Elle ajoute, depuis une zone « Inscription à la lettre » posée sur une page, l'adresse d'un visiteur à la liste du client chez Brevo ou Mailchimp."
