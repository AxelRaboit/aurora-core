    posts:
        settings_guide:
            title: "How publishing is set"
            step_1: "The status decides whether the page can be read: “Draft” keeps it in the administration, “Published” puts it online, “Scheduled” publishes it on its own at the chosen date."
            step_2: "“On the site” shows it in lists, menus, search and the sitemap; “Link only” shows it nowhere and is read through a reading link."
            step_3: "With the right to publish, “Reading links” creates a secret address per recipient, which only opens once the post is published."
            step_4: "“Take down on” moves a live post to “Archived” at the chosen date; left empty, it stays online."
            step_5: "“Preview” saves, then opens a secret address valid for seven days, and “History” restores a previously saved version."
        guide:
            title: "How a page gets published"
            step_1: "A post starts as a draft: it is only visible in the administration."
            step_2: "“Published” puts it online; “Scheduled”, with a date, publishes it on its own at the planned minute."
            step_3: "Without the right to publish, choosing “Published” or “Scheduled” sets it “Pending review”: once approved it goes out at the chosen date, otherwise it goes back to draft."
            step_4: "“On the site” shows it in lists, menus and search; “Link only” shows it nowhere and is shared through a reading link."
            step_5: "Each save keeps a version (twenty by default), and “Preview” gives a secret address valid seven days."
