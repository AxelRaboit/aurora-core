    taxonomies:
        guide:
            title: "How taxonomies work"
            step_1: "A taxonomy sorts posts into categories or tags; pick it in the side menu to see its terms."
            step_2: "“Applies to” chooses the content types concerned: their posts tick its terms in the Settings tab."
            step_3: "With “Nested terms”, a term sits under a parent like a category; without it, terms stay on one level like tags."
            step_4: "Each term has a name and a slug per language, and its page on the site lists the published posts that carry it or one of its children."
            step_5: "Deleting a term moves its children up one level; deleting a taxonomy takes its terms with it, and a built-in taxonomy cannot be deleted."
