                tag: Tags
        github:
            settings:
                what_title: What this integration does
                what_body: "It shows, in a « GitHub activity » zone placed on a page, the contributions grid of the accounts below: one cell per day over the last twelve months, as on a GitHub profile."
                source_title: Where the data comes from
                source_body: "From each profile's public page, the one any visitor can open: no key, no account to connect. The grids are read again every six hours. If GitHub does not answer, the last grid read stays on the page."
                logins_label: GitHub accounts
                logins_hint: "One username per line, in display order, four at most. The « @ » is optional."
                enabled_label: Show GitHub activity
                enabled_hint: "The « GitHub activity » zones of your pages show these accounts."
                enabled_blocked: "Enter at least one account to turn the integration on."
            errors:
                invalid_login: "Invalid GitHub username: {logins}. Letters, digits and hyphens only."
                too_many: "{max} accounts at most."
                logins_required: "Enter at least one account to turn the integration on."
        instagram:
            settings:
                what_title: What this integration does
                what_body: "It shows, in an « Instagram feed » zone placed on a page, the recent posts of the client's own business account."
                how_title: How to open it
                how_step_business: "The Instagram account must be a business or creator account, linked to a Facebook page."
                how_step_app: "In Meta for Developers, create an app and add the « Instagram API » product to it."
                how_step_token: "Generate a long-lived access token for that account, from this app."
                how_step_paste: "Copy the business account id and the token, and paste them below."
                how_link: Meta documentation
                terms_label: I have read and accept Meta's platform terms
                terms_hint: "The feed shows posts that stay the account's own: nothing is copied or republished elsewhere."
                terms_link: Meta platform terms
                accepted_on: "Accepted on {date} by {user}."
                business_id_label: Business account id
                business_id_hint: "The Instagram Business Account number, not the username."
                token_label: Access token
                token_stored: A token is stored.
                token_hint: Paste the long-lived token generated for this account here.
                enabled_label: Show the Instagram feed
                enabled_hint: "The « Instagram feed » zones of your pages show this account."
                enabled_blocked: "Enter the account, the token and accept the terms to turn the integration on."
            errors:
                terms_required: "You must accept Meta's platform terms to turn the integration on."
                account_required: "Enter the account id and the access token to turn the integration on."
        google_reviews:
            settings:
                what_title: What this integration does
                what_body: "It shows, in a « Google reviews » zone placed on a page, the rating and latest reviews of the client's own business listing."
                how_title: How to open it
                how_step_console: "Create an API key in the client's own Google Cloud Console, restricted to the Places API."
                how_step_key: "Copy that key and paste it below."
                how_step_place: "Find the business listing's Place ID and paste that too."
                how_link: Find a Place ID
                terms_label: I have read and accept the Google Maps Platform terms
                terms_hint: "The reviews shown stay the ones on the Google listing: nothing is copied or edited."
                terms_link: Google Maps Platform terms
                accepted_on: "Accepted on {date} by {user}."
                place_label: Listing id (Place ID)
                place_hint: "The client's own business, never another one."
                key_label: API key
                key_stored: A key is stored.
                key_hint: Paste the client's Places API key here.
                enabled_label: Show Google reviews
                enabled_hint: "The « Google reviews » zones of your pages show this listing."
                enabled_blocked: "Enter the listing, the key and accept the terms to turn the integration on."
            errors:
                terms_required: "You must accept the Google Maps Platform terms to turn the integration on."
                place_required: "Enter the listing id and the API key to turn the integration on."
        useful_links:
            settings:
                guide:
                    title: "How useful links work"
                    step_1: "Add a link with its label, its address and its colour; the address starts with https:// or mailto:."
                    step_2: "Drag the handle to change the order, then save: a link without a label or a valid address is removed on save."
                    step_3: "They show at the bottom of every post, beside the share buttons when those are on."
                    step_4: "In a post's Settings tab, you can hide them or replace them with links of its own."
                title: The site's useful links
                intro: "Set once here, they show at the foot of every publication, beside “Share”: where else to find the author, the product, the code. A publication can hide them or have its own, in its Settings tab."
        newsletter:
            settings:
                what_title: What this integration does
                what_body: "It adds, from a « Newsletter signup » zone placed on a page, a visitor's address to the client's own list at Brevo or Mailchimp."
                provider_label: Provider
                providers:
                    brevo: Brevo
                    mailchimp: Mailchimp
                how_title: How to open it
                how_brevo: "In Brevo, the API key is under Account settings > API keys. The list id shows on the list's own page."
                how_mailchimp: "In Mailchimp, the API key is created under Account > Extras > API keys. The audience (list) id is in its settings."
                terms_label: I have read and accept the chosen provider's terms
                terms_hint: "A visitor's address is sent to the chosen provider, under their own account."
                accepted_on: "Accepted on {date} by {user}."
                list_label_brevo: List id
                list_label_mailchimp: Audience id
                key_label: API key
                key_stored: A key is stored.
                key_hint: Paste the client's own account key here.
                enabled_label: Show the newsletter signup
                enabled_hint: "The « Newsletter signup » zones of your pages add an address to this list."
                enabled_blocked: "Enter the list, the key and the privacy policy, and accept the terms, to turn the integration on."
                compliance_title: Compliance (GDPR)
                compliance_body: "The form always asks visitors to tick a consent box, and tells them under the field what their address is for, who receives it and how to unsubscribe."
                double_opt_in_label: Email confirmation (recommended)
                double_opt_in_hint: "Visitors get an email and join the list only once they click its link. Nobody can sign someone else up, and the provider keeps the proof of consent."
                brevo_template_label: Confirmation email template (Brevo)
                brevo_template_hint: "Brevo requires one to send the confirmation: create a template in Campaigns > Templates, tagged « optin », with the « doubleoptin » confirmation link Brevo offers, then enter its number here."
                privacy_label: Privacy policy address
                privacy_hint: "Required: the link shows under the form. An https:// address or a path of this site, for example /en/page/privacy. It must name the mailing provider."
            errors:
                terms_required: "You must accept the provider's terms to turn the integration on."
                list_required: "Enter the list id and the API key to turn the integration on."
                privacy_required: "Enter the address of your privacy policy to turn the integration on: the GDPR requires informing visitors where their address is collected."
                privacy_url_invalid: "The policy address must start with https:// or / (a path of this site)."
                template_required: "With Brevo, email confirmation needs the number of a confirmation email template."
                template_invalid: The Brevo template number must be a number.
