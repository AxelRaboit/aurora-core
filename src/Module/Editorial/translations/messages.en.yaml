            title: "How content types work"
            step_1: "A content type groups posts of the same kind, such as articles or services; pick it in the side menu to see its settings."
            step_2: "Its posts have their address under its slug, and “Has a listing page” adds a page on the site that lists them all."
            step_3: "Capabilities give its posts block content, the featured image or reading in sequence."
            step_4: "Custom fields add boxes to fill in on every post of the type, shared by all languages or separate for each with “Per language”."
            step_5: "A built-in type keeps its slug and cannot be deleted; any other type can only be deleted once it holds no posts, trash included."
