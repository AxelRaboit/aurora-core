    forms:
        editor_guide:
            title: "How this form is set up"
            step_1: "In “Questions”, add a question by choosing its type, then click it to edit it; the preview shows what the visitor will see."
            step_2: "“Split into steps” spreads the questions over several pages, and a question can appear only depending on the answer to a question placed before it."
            step_3: "“Answers” lists what was sent, newest first, and “Export as CSV” takes all of it for a spreadsheet."
            step_4: "“Settings” sets the title and address in each language, puts the form online or offline, and chooses who is told about each answer."
            step_5: "Without an email address, each answer goes to the site administrator; offline, the form disappears from the pages it sits on."
        guide:
            title: "How forms work"
            step_1: "Create a form from a template: blank, contact, two-step quote request, event registration."
            step_2: "In “Questions”, add them in the order the visitor will see them, split into steps if needed; a question can depend on an earlier answer."
            step_3: "Answers arrive in “Answers”, exportable as CSV; “Settings” can also notify you by email or send them to a webhook."
            step_4: "To show it, add a “Form” zone to a post's grid; offline, it disappears from every page."
            step_5: "Deleting a form is permanent and takes its answers with it: it does not go through the trash."
