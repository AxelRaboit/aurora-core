    post_galleries:
        editor_guide:
            title: "How the gallery is put together"
            step_1: "Switch the gallery on to show it under the post's content, then choose its layout, columns and ratio."
            step_2: "“Add a picture” takes one from the library or your computer, and “Import pictures” sends several at once, sixty at most."
            step_3: "Drag a picture or use its arrows to change the order, which is the same in every language."
            step_4: "“Picture text” sets its alternative text and caption in each language; left empty, the alternative text comes from the library."
            step_5: "Nothing is kept until you click “Save”."
        guide:
            title: "How galleries get filled"
            step_1: "Each post can carry an image gallery, shown under its content once switched on."
            step_2: "The list shows how many photos each post has: “No photos” spots the ones still to fill."
            step_3: "“Gallery” opens only the post's pictures: its text, status and search settings cannot change there."
            step_4: "You see every post here, including other authors' ones, except those in the trash."
