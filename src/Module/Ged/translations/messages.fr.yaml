        documents:
            trashed:
                title: "Ce document est dans la corbeille"
                body: "Mis à la corbeille le {date}. Son fichier n'est plus servi aux visiteurs, et la purge automatique l'effacera s'il n'est pas restauré."
                badge: "Dans la corbeille"
            show_guide:
                title: "Ce que vous pouvez faire ici"
                step_1: "Le bouton d'actions en haut permet de télécharger le fichier, de modifier le document ou de l'envoyer à la corbeille."
                step_2: "Seul un document au statut « Publié » est servi aux visiteurs du site ; un brouillon ou une archive reste réservé à la suite."
                step_3: "Sur une image, « Recadrer » enregistre une nouvelle version du fichier, régénère ses tailles et garde la précédente dans l'historique."
                step_4: "Si le document a des variantes, sa famille s'affiche en bas avec l'endroit où chacune est utilisée, et un clic ouvre la page d'une variante."
            guide:
                title: "Comment se range la médiathèque"
                step_1: "Un fichier déposé devient un document, rangé dans un dossier, avec une catégorie (sa nature) et autant d'étiquettes que vous voulez."
                step_2: "Une variante (autre couleur, version sans texte) se rattache à son original et forme une famille ; « Variante de couleur » en crée une à partir d'une image."
                step_3: "Le badge « Inutilisé » signale un document qu'aucune page, présentation ou espace n'affiche ; « À conserver » le garde quand même."
                step_4: "Supprimer envoie le document à la corbeille, d'où il se restaure jusqu'à la purge automatique."
                step_5: "La recherche lit aussi le nom du fichier, les textes et les étiquettes ; « Plus de filtres » précise par date, format ou poids."
            row_actions:
                view_description: Ouvre l'aperçu, ses versions et où il est utilisé.
                download_description: Télécharge le fichier tel qu'il a été déposé.
                qr_description: Affiche un QR code menant à ce document.
                edit_description: Titre, catégorie, étiquettes, dossier.
                delete_description: Envoie le document à la corbeille, d'où il se restaure.
                restore_description: "Le sort de la corbeille avec son fichier, ses tailles et sa place dans sa famille."
