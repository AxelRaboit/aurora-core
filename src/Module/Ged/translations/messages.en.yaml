        categories:
            guide:
                title: "Category, tag or folder"
                step_1: "The category states what a document is, such as an invoice, a photo or a logo: each document has one at most."
                step_2: "Tags are free keywords: a document carries as many as you like, on top of its category."
                step_3: "The folder states where the document is filed in the tree, whatever its nature."
                step_4: "Images uploaded from an editing form or imported from Pexels are filed under “Editorial media” automatically."
                step_5: "Deleting a category sends it to the trash, where you can restore it; no document is deleted."
            row_actions:
