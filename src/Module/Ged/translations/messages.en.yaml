        documents:
            trashed:
                title: "This document is in the trash"
                body: "Moved to the trash on {date}. Its file is no longer served to visitors, and the automatic purge will erase it unless it is restored."
                badge: "In the trash"
            show_guide:
                title: "What you can do here"
                step_1: "The actions button at the top lets you download the file, edit the document or send it to the trash."
                step_2: "Only a document with the “Published” status is served to the site's visitors; a draft or an archive stays in the suite."
                step_3: "On an image, “Crop” saves a new version of the file, regenerates its sizes and keeps the previous one in the history."
                step_4: "If the document has variants, its family appears at the bottom with where each one is used, and a click opens a variant's page."
            guide:
                title: "How the media library is organised"
                step_1: "An uploaded file becomes a document, filed in a folder, with one category (its nature) and as many tags as you like."
                step_2: "A variant (another colour, a text-free version) is attached to its original and forms a family; “Colour variant” creates one from an image."
                step_3: "The “Unused” badge marks a document no page, deliverable or space shows; “Keep” keeps it anyway."
                step_4: "Deleting sends the document to the trash, where it can be restored until the automatic purge."
                step_5: "Search also reads the file name, the texts and the tags; “More filters” narrows by date, shape or weight."
            row_actions:
                view_description: Opens the preview, its versions and where it is used.
                download_description: Downloads the file exactly as it was uploaded.
                qr_description: Shows a QR code pointing at this document.
                edit_description: Title, category, tags, folder.
                delete_description: Sends the document to the trash, where it can be restored.
                restore_description: "Brings it back from the trash with its file, its sizes and its place in its family."
                relocate_to_remote: Move to remote storage
                relocate_to_local: Bring back to the server
                relocate_description: "Moves the file, its resized copies and its history. Its address does not change."
                relocate_pending: A move is already under way for this document.
