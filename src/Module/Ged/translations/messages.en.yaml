            guide:
                title: "What tags are for"
                step_1: "A tag is a free keyword: a document can carry as many as you like, on top of its category and its folder."
                step_2: "You add them to a document when you upload it or edit it, from the media library."
                step_3: "In the document list, the tag filter finds the documents that carry it, or those that have none, and search also reads tag names."
                step_4: "The colour is optional: it tints the tag's chip in the media library."
                step_5: "Deleting a tag removes it from every document, without deleting any document."
            row_actions:
