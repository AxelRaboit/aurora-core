                terms_label: I have read and accept the Pexels terms of service
                terms_hint: "The Pexels account is yours, and its holder answers for how the photos are used. On a site that sells a product or a service in particular, avoid photos showing a recognisable face or a brand: they can suggest an endorsement. Do not redistribute the files themselves either, for instance in a folder handed to a third party."
