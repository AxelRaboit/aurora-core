name: Setup Node
description: Node 24 and pnpm 10, with the JS dependencies from the lock.

runs:
  using: composite
  steps:
    # Deliberately no `cache:` input. setup-node v5 began caching
    # automatically by detecting the package manager, which would have run
    # `pnpm store path` here - one step before pnpm is installed. v6 narrowed
    # that to npm, and this repo has no package-lock.json, so nothing fires.
    # The pnpm store is cached explicitly two steps down instead.
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install pnpm
      shell: bash
      run: npm install -g pnpm@10

    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v6
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install JS dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
