name: CI

on:
  # Direct pushes only on long-lived branches; feature branches are tested
  # via their pull_request event so we don't run the same commit twice.
  push:
    branches: [master, develop]
  pull_request:
  # Le job `lowest` ci-dessous ne tourne pas sur les pushes ; ceci permet de
  # le lancer a la demande sans ouvrir une PR vers master.
  workflow_dispatch:

# A second push on the same ref cancels the previous in-flight run instead
# of queueing a duplicate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Des jobs paralleles plutot qu'un seul qui fait tout a la suite. Jusqu'au
# 27/09/2026, un job unique enchainait l'installation, les controles, les tests
# front, les unitaires et l'integration : 10 minutes de mur, dont 4 pour
# l'integration seule, alors que les controles et les tests front n'ont meme
# pas besoin de la base. Chaque job paie son installation (une minute et
# demie), mais ils tournent ensemble et le depot est public : les minutes ne
# coutent rien, seule l'attente compte.
env:
  APP_ENV: test
  APP_SECRET: ci_secret_not_used_in_prod
  DATABASE_URL: postgresql://app:!ChangeMe!@127.0.0.1:5432/aurora?serverVersion=18&charset=utf8

jobs:
  quality:
    name: Qualite PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Validate composer.json and composer.lock
        run: composer validate

      # -- Avis de securite 🔒 -------------------------------------------------
      # Deux etapes, et la premiere n'echoue jamais : elle imprime tout, pour
      # que les avis moderes et bas restent visibles dans le journal.
      #
      # La seconde tranche. Jusqu'au 16/09/2026 il n'y avait que la premiere,
      # avec `|| true`, donc l'audit tournait et son resultat partait a la
      # poubelle : soixante-et-onze avis se sont accumules sans qu'aucun run ne
      # rougisse, et c'est l'avertissement de GitHub au moment d'un `git push`
      # qui les a fait remonter.
      #
      # Le seuil est `high`. Un avis bas ou modere publie en amont ferait
      # rougir un build un matin ou personne n'a touche au code, ce qui apprend
      # a ignorer la couleur. Un avis haut bloque la livraison, ce qui est le
      # but.
      - name: Report every advisory (never fails)
        run: composer audit --locked || true

      - name: Fail on high or critical advisories
        run: composer audit --locked --ignore-severity=low --ignore-severity=medium

      - name: Install PHP code quality tools
        run: |
          (cd tools/php-cs-fixer && composer install && chmod +x vendor/bin/*)
          (cd tools/twig-cs-fixer && composer install && chmod +x vendor/bin/*)
          (cd tools/rector && composer install && chmod +x vendor/bin/*)
          (cd tools/phpstan && composer install && chmod +x vendor/bin/*)

      # -- Coding standards ✨ ------------------------------------------------------
      - name: PHP CS Fixer
        run: make lint-php

      - name: Lint Twig
        run: make lint-twig

      - name: Create cache directories
        run: mkdir -p var/cache/rector var/cache/phpstan

      - name: Rector Cache
        uses: actions/cache@v6
        with:
          path: var/cache/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-rector-

      - name: Rector
        run: make rector

      # -- Static analysis ✨ -------------------------------------------------
      - name: PHPStan Cache
        uses: actions/cache@v6
        with:
          path: var/cache/phpstan
          key: phpstan-${{ runner.os }}-${{ hashFiles('tools/phpstan/phpstan.neon') }}
          restore-keys: phpstan-${{ runner.os }}-

      - name: PHPStan
        run: make stan

  frontend:
    name: Front (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [ 1, 2 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # PHP aussi : les tests front lisent le catalogue de traductions que la
      # console exporte depuis les YAML.
      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Setup Node
        uses: ./.github/actions/setup-node

      # Le pendant JS, qui n'existait pas du tout : soixante-deux des
      # soixante-et-onze avis etaient npm, et rien dans la CI ne les regardait.
      #
      # Le lock fait davantage autorite ici que cote PHP : un projet qui
      # consomme aurora-core installe ses dependances JS avec
      # `pnpm --dir=vendor/axelraboit/aurora install --frozen-lockfile`, donc
      # depuis **ce** lock. Les plages de `package.json` ne sont jamais
      # resolues par personne, et auditer le lock est exactement auditer ce qui
      # sera livre.
      #
      # Audit et lint une seule fois, sur la premiere tranche.
      - name: Report every JS advisory (never fails)
        if: matrix.shard == 1
        run: pnpm audit || true

      - name: Fail on high or critical JS advisories
        if: matrix.shard == 1
        run: pnpm audit --audit-level high

      - name: Lint JavaScript
        if: matrix.shard == 1
        run: make lint-js

      - name: Export translations
        run: php bin/console app:translations:dump-js

      - name: Run frontend tests
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

  unit:
    name: Tests unitaires PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      # Ni base ni assets : mesure le 27/09/2026, la suite passe entiere avec
      # une base injoignable et sans `public/build`. Le catalogue de
      # traductions exporte, lui, est verifie par un test : dans l'ancien job
      # unique, l'etape des tests front l'avait produit juste avant.
      - name: Export translations
        run: php bin/console app:translations:dump-js

      - name: Run backend unit tests
        run: make test-backend-unit

  integration:
    name: Integration (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [ 1, 2, 3 ]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: "!ChangeMe!"
          POSTGRES_DB: aurora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      # Les tests d'integration rendent des pages, et le rendu d'un template
      # passe par les tags Vite : sans manifeste, ils echouent.
      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build assets
        run: pnpm build

      - name: Create and migrate the test database (dbname_suffix _test applied by Doctrine)
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction

      # La tranche est calculee par tools/ci/shard.php depuis les fichiers du
      # disque : un test neuf tombe toujours dans une tranche, et
      # CiShardsCoverEveryIntegrationTestTest verifie qu'aucun ne se perd.
      - name: Run backend integration tests
        run: php bin/phpunit --testdox $(php tools/ci/shard.php 3 ${{ matrix.shard }})

  lowest:
    name: Minimums declares (${{ matrix.shard }}/3)
    # Une PR vers master est une release : c'est la que les contraintes de
    # composer.json deviennent un contrat publie, et le seul moment ou il vaut
    # la peine de payer un second run complet.
    #
    # **Ce que ce job repond, et que rien d'autre ne repondait.** La CI
    # ci-dessus fait `composer install` depuis le lock commite, donc elle teste
    # toujours une seule combinaison : celle qui a ete resolue le jour ou
    # quelqu'un a lance `composer update`. Les minimums ecrits dans
    # composer.json ne sont jamais exerces. Une contrainte qui dit `^3.0` alors
    # que le code appelle une methode apparue en 3.4 passe donc au vert ici et
    # casse chez le projet qui consomme la bibliotheque, puisque lui resout les
    # contraintes et non le lock.
    #
    # Le reglage `bump-after-update` a longtemps masque ce trou en remontant
    # mecaniquement les planchers a chaque update. Il enregistrait ce qui etait
    # installe ce jour-la, pas ce dont le code a besoin, et il interdisait donc
    # au consommateur des versions qui marchent. Mesure le 16/09/2026 : les
    # 7496 tests passent aux minimums declares. Il est retire, et ce job est ce
    # qui garde la question ouverte.
    #
    # En trois tranches comme l'integration, les unitaires sur la premiere :
    # c'est le job le plus long d'une PR de release.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [ 1, 2, 3 ]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: "!ChangeMe!"
          POSTGRES_DB: aurora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP, extensions & composer with shivammathur/setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, dom, filter, json, tokenizer
          ini-values: post_max_size=256M, max_execution_time=180
        env:
          update: true

      # Pas de cache composer : la resolution est justement ce qu'on veut
      # refaire, et elle ne ramene pas les memes paquets que le job voisin.
      - name: Install the declared minimums
        run: composer update --prefer-lowest --prefer-stable --no-ansi --no-interaction --prefer-dist --no-scripts

      - name: Show what was resolved
        run: composer show --direct

      # Les assets sont construits parce que les tests d'integration rendent des
      # pages, et le rendu d'un template passe par les tags Vite. Ils ne
      # dependent pas de la resolution PHP, mais leur absence ferait echouer ce
      # job pour une raison qui n'a rien a voir avec son sujet.
      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build assets
        run: pnpm build

      - name: Create and migrate the test database (dbname_suffix _test applied by Doctrine)
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction

      # Ni lint ni analyse statique : ce job ne parle pas du style du code, il
      # demande si le code tourne contre le plancher qu'on publie.
      - name: Export translations
        if: matrix.shard == 1
        run: php bin/console app:translations:dump-js

      - name: Run backend unit tests
        if: matrix.shard == 1
        run: make test-backend-unit

      - name: Run backend integration tests
        run: php bin/phpunit --testdox $(php tools/ci/shard.php 3 ${{ matrix.shard }})
