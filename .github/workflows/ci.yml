name: CI

on:
  # Direct pushes only on long-lived branches; feature branches are tested
  # via their pull_request event so we don't run the same commit twice.
  push:
    branches: [master, develop]
  pull_request:
  # The `lowest` job below does not run on pushes; this lets it be started
  # on demand without opening a PR to master.
  workflow_dispatch:

# A second push on the same ref cancels the previous in-flight run instead
# of queueing a duplicate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Parallel jobs rather than a single one doing everything in a row. Until
# 27/09/2026, a single job chained the install, the checks, the front tests,
# the unit tests and the integration tests: 10 minutes of wall time, 4 of them
# for integration alone, while the checks and the front tests do not even need
# the database. Each job pays for its install (a minute and a half), but they
# run together and the repository is public: the minutes cost nothing, only
# the wait counts.
env:
  APP_ENV: test
  APP_SECRET: ci_secret_not_used_in_prod
  DATABASE_URL: postgresql://app:!ChangeMe!@127.0.0.1:5432/aurora?serverVersion=18&charset=utf8

jobs:
  quality:
    name: Qualite PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Validate composer.json and composer.lock
        run: composer validate

      # -- Security advisories 🔒 ---------------------------------------------
      # Two steps, and the first one never fails: it prints everything, so
      # that moderate and low advisories stay visible in the log.
      #
      # The second one decides. Until 16/09/2026 there was only the first,
      # with `|| true`, so the audit ran and its result went in the bin:
      # seventy-one advisories piled up without a single run turning red, and
      # it was GitHub's warning on a `git push` that brought them up.
      #
      # The threshold is `high`. A low or moderate advisory published upstream
      # would turn a build red on a morning when nobody touched the code,
      # which teaches people to ignore the colour. A high advisory blocks the
      # delivery, which is the point.
      - name: Report every advisory (never fails)
        run: composer audit --locked || true

      - name: Fail on high or critical advisories
        run: composer audit --locked --ignore-severity=low --ignore-severity=medium

      - name: Install PHP code quality tools
        run: |
          (cd tools/php-cs-fixer && composer install && chmod +x vendor/bin/*)
          (cd tools/twig-cs-fixer && composer install && chmod +x vendor/bin/*)
          (cd tools/rector && composer install && chmod +x vendor/bin/*)
          (cd tools/phpstan && composer install && chmod +x vendor/bin/*)

      # -- Coding standards ✨ ------------------------------------------------------
      - name: PHP CS Fixer
        run: make lint-php

      - name: Lint Twig
        run: make lint-twig

      - name: Create cache directories
        run: mkdir -p var/cache/rector var/cache/phpstan

      - name: Rector Cache
        uses: actions/cache@v6
        with:
          path: var/cache/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-rector-

      - name: Rector
        run: make rector

      # -- Static analysis ✨ -------------------------------------------------
      - name: PHPStan Cache
        uses: actions/cache@v6
        with:
          path: var/cache/phpstan
          key: phpstan-${{ runner.os }}-${{ hashFiles('tools/phpstan/phpstan.neon') }}
          restore-keys: phpstan-${{ runner.os }}-

      - name: PHPStan
        run: make stan

  frontend:
    name: Front (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [ 1, 2 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # PHP too: the front tests read the translation catalogue that the
      # console exports from the YAML files.
      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Setup Node
        uses: ./.github/actions/setup-node

      # The JS counterpart, which did not exist at all: sixty-two of the
      # seventy-one advisories were npm, and nothing in the CI looked at them.
      #
      # The lock carries more authority here than on the PHP side: a project
      # consuming aurora-core installs its JS dependencies with
      # `pnpm --dir=vendor/axelraboit/aurora install --frozen-lockfile`, so
      # from **this** lock. The ranges in `package.json` are never resolved by
      # anybody, and auditing the lock is exactly auditing what will ship.
      #
      # Audit and lint only once, on the first shard.
      - name: Report every JS advisory (never fails)
        if: matrix.shard == 1
        run: pnpm audit || true

      - name: Fail on high or critical JS advisories
        if: matrix.shard == 1
        run: pnpm audit --audit-level high

      - name: Lint JavaScript
        if: matrix.shard == 1
        run: make lint-js

      - name: Export translations
        run: php bin/console app:translations:dump-js

      - name: Run frontend tests
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

  unit:
    name: Tests unitaires PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      # No database and no assets: measured on 27/09/2026, the whole suite
      # passes with an unreachable database and without `public/build`. The
      # exported translation catalogue, though, is checked by a test: in the
      # old single job, the front tests step had produced it just before.
      - name: Export translations
        run: php bin/console app:translations:dump-js

      - name: Run backend unit tests
        run: make test-backend-unit

  integration:
    name: Integration (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [ 1, 2, 3 ]
    services:
      postgres:
        # The official image, from Amazon's public mirror rather than Docker
        # Hub: Hub caps anonymous pulls per address, the hosted runners share
        # theirs, and a busy day failed every integration shard on it
        # (09/10/2026).
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: "!ChangeMe!"
          POSTGRES_DB: aurora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      # The integration tests render pages, and rendering a template goes
      # through the Vite tags: without a manifest, they fail.
      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build assets
        run: pnpm build

      - name: Create and migrate the test database (dbname_suffix _test applied by Doctrine)
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction

      # The shard is computed by tools/ci/shard.php from the files on disk: a
      # new test always lands in a shard, and
      # CiShardsCoverEveryIntegrationTestTest checks that none gets lost.
      - name: Run backend integration tests
        run: php bin/phpunit --testdox $(php tools/ci/shard.php 3 ${{ matrix.shard }})

  lowest:
    name: Minimums declares (${{ matrix.shard }}/3)
    # A PR to master is a release: that is where the constraints in
    # composer.json become a published contract, and the only time it is
    # worth paying for a second full run.
    #
    # **What this job answers, and nothing else did.** The CI above runs
    # `composer install` from the committed lock, so it always tests a single
    # combination: the one resolved on the day somebody ran `composer update`.
    # The minimums written in composer.json are never exercised. A constraint
    # saying `^3.0` while the code calls a method that appeared in 3.4 thus
    # goes green here and breaks in the project consuming the library, since
    # that project resolves the constraints and not the lock.
    #
    # The `bump-after-update` setting long hid this gap by mechanically
    # raising the floors on every update. It recorded what was installed that
    # day, not what the code needs, and so it denied the consumer versions
    # that work. Measured on 16/09/2026: the 7496 tests pass on the declared
    # minimums. It is removed, and this job is what keeps the question open.
    #
    # In three shards like integration, the unit tests on the first one: it
    # is the longest job of a release PR.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [ 1, 2, 3 ]
    services:
      postgres:
        # The official image, from Amazon's public mirror rather than Docker
        # Hub: Hub caps anonymous pulls per address, the hosted runners share
        # theirs, and a busy day failed every integration shard on it
        # (09/10/2026).
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: "!ChangeMe!"
          POSTGRES_DB: aurora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP, extensions & composer with shivammathur/setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, dom, filter, json, tokenizer
          ini-values: post_max_size=256M, max_execution_time=180
        env:
          update: true

      # No composer cache: the resolution is precisely what has to be redone,
      # and it does not bring back the same packages as the neighbouring job.
      - name: Install the declared minimums
        run: composer update --prefer-lowest --prefer-stable --no-ansi --no-interaction --prefer-dist --no-scripts

      - name: Show what was resolved
        run: composer show --direct

      # The assets are built because the integration tests render pages, and
      # rendering a template goes through the Vite tags. They do not depend on
      # the PHP resolution, but their absence would fail this job for a reason
      # that has nothing to do with its subject.
      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build assets
        run: pnpm build

      - name: Create and migrate the test database (dbname_suffix _test applied by Doctrine)
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction

      # No lint and no static analysis: this job is not about code style, it
      # asks whether the code runs against the floor that is published.
      - name: Export translations
        if: matrix.shard == 1
        run: php bin/console app:translations:dump-js

      - name: Run backend unit tests
        if: matrix.shard == 1
        run: make test-backend-unit

      - name: Run backend integration tests
        run: php bin/phpunit --testdox $(php tools/ci/shard.php 3 ${{ matrix.shard }})
