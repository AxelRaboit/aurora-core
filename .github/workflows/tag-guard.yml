name: Tag guard

# A tag without a release is a version nobody documented.
#
# Composer offers a client every tag it can see, so a stray one becomes an
# installable version with no notes, no changelog entry, and no guarantee it
# ever passed CI. `make tag` already refuses, which covers the reflex; this
# covers the deliberate `git tag && git push`.
#
# It never fires for a release published by the Release workflow, and that is
# GitHub's doing rather than a choice here: events produced with the default
# GITHUB_TOKEN do not trigger further workflows. Which lands exactly right - the
# automated path is the one that cannot be wrong, and the manual `git push
# origin vX.Y.Z`, made with a person's own credentials, is the one this exists
# for and the one that does trigger it.
#
# The wait covers the case where somebody tags by hand and creates the release
# a moment later, so the guard does not fail a release that was about to be
# right. A minute is far more than that takes and far less than a person needs
# to notice a red run.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  guard:
    name: A tag must carry a release
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the release to appear
        run: sleep 60

      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::${TAG} carries a release."
            exit 0
          fi

          echo "::error::${TAG} was pushed without a release."
          echo ""
          echo "Composer offers this tag to every client as an installable"
          echo "version, with no notes and no proof it passed CI."
          echo ""
          echo "Either publish it:  gh release create ${TAG} --notes-file ..."
          echo "or remove it:       git push --delete origin ${TAG}"
          exit 1
