services:
###> symfony/mercure-bundle ###
    # The real-time hub, for development: `make start` brings it up, `make
    # hub-start` brings it back up on its own. In production it runs as a
    # systemd service behind Apache, where the browser reaches it through the
    # same origin as the application and none of this is needed.
    #
    # Four allowed origins because the dev server is served over http as well
    # as https and under both loopback names: a single one of them lets the
    # connection fail under the other three, and that looks like a hub that
    # is down.
    #
    # Protocol 1.0, like the application: the trusted issuer is the Symfony
    # server, and `resource_identifier` pins the tokens' audience so PHP can
    # publish over the loopback while the browser connects through the public
    # host.
    mercure:
        image: dunglas/mercure
        restart: unless-stopped
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
            MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
            MERCURE_TRUSTED_ISSUERS: 'http://localhost:8000'
            MERCURE_EXTRA_DIRECTIVES: |
                resource_identifier http://localhost:3000/.well-known/mercure
                cors_origins http://localhost:8000 https://localhost:8000 http://127.0.0.1:8000 https://127.0.0.1:8000
        ports:
            - "3000:80"
        volumes:
            - mercure_data:/data
            - mercure_config:/config

volumes:
    mercure_data:
    mercure_config:
###< symfony/mercure-bundle ###
